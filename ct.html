function refreshInfo(){
 var g=CP.U.g;if(!g)return;
 var T=totals(g),el=$('#gTot');
 if(el){
  var ok=T.g===0&&T.d>0;
  el.innerHTML='<span><small>'+esc(t('Total débit'))+'</small><b>'+CP.money(T.d)+'</b></span><span><small>'+esc(t('Total crédit'))+'</small><b>'+CP.money(T.c)+'</b></span><span><small>'+esc(t('Écart'))+'</small><b class="'+(T.g?'bad':'ok')+'">'+CP.money(Math.abs(T.g))+'</b></span>'
   +(ok?'<span class="pill p-good badge-ok">'+ic('check',14)+esc(t('ÉCRITURE ÉQUILIBRÉE'))+'</span>':(T.d||T.c?'<span class="pill p-crit">'+esc(t('Déséquilibrée'))+'</span><button type="button" class="btn sm" data-act="g.bal">'+esc(t('Équilibrer'))+'</button>':'<span class="pill p-warn">'+esc(t('En attente de saisie'))+'</span>'));
 }
 var al=$('#gAlerts');if(al){var L=alerts(g);al.innerHTML=L.map(function(x){return '<div class="g-al '+x.k+'">'+ic(x.k==='info'?'info':'alert',16)+'<span>'+esc(x.x)+'</span></div>'}).join('')}
 var sg=$('#gSug');if(sg)sg.innerHTML=sugg(g);
 saveDraft();
}
CP.CTAFTER.saisie=function(){
 refreshInfo();
 var g=CP.U.g;if(!g)return;
 var f=$('[data-gr="0"][data-gf="acc"]');if(f&&!CP.U.noFocus)f.focus({preventScroll:true});CP.U.noFocus=false;
};
function focusCell(r,f){var el=$('[data-gr="'+r+'"][data-gf="'+f+'"]');if(el){el.focus();if(el.select)el.select()}}
function redrawRows(){var el=$('#gRows');if(el)el.innerHTML=rowsHtml(CP.U.g);refreshInfo()}
CP.gridAdd=function(){var g=CP.U.g;if(!g)return;g.rows.push({acc:'',label:'',d:'',c:''});redrawRows();focusCell(g.rows.length-1,'acc')};

/* ---------- Auto-complétion des comptes ---------- */
var drop=null,dI=0,dL=[],dFor=null,hT=0;
function dropEl(){if(!drop){drop=document.createElement('div');drop.className='acdrop';drop.id='acDrop';drop.setAttribute('role','listbox');drop.hidden=true;document.body.appendChild(drop);drop.addEventListener('mousedown',function(e){var b=e.target.closest('[data-ai]');if(b){e.preventDefault();pick(dL[+b.dataset.ai])}})}return drop}
function showDrop(inp){
 var q=inp.value.trim(),d=dropEl();dFor=inp;clearTimeout(hT);
 if(!q){hideDrop();return}
 dL=CP.coaSearch(q,8);
 if(!dL.length){d.innerHTML='<div class="empty sm">'+esc(t('Aucun compte trouvé'))+'</div>';place(inp);d.hidden=false;return}
 dI=0;
 d.innerHTML=dL.map(function(a,i){return '<button type="button" class="ac-i" role="option" data-ai="'+i+'" aria-selected="'+(i===0)+'"><b class="mono">'+esc(a.n)+'</b><span>'+esc(a.l)+'</span>'+(a.custom?'<em>'+esc(t('perso'))+'</em>':'')+'</button>'}).join('');
 place(inp);d.hidden=false;inp.setAttribute('aria-expanded','true');
}
function place(inp){var r=inp.getBoundingClientRect(),d=dropEl();d.style.left=Math.max(8,Math.min(r.left,window.innerWidth-Math.min(360,window.innerWidth-16)-8))+'px';d.style.top=(r.bottom+4)+'px';d.style.width=Math.min(360,window.innerWidth-16)+'px'}
function hideDrop(){if(drop){drop.hidden=true}if(dFor)dFor.setAttribute('aria-expanded','false');dL=[]}
function markDrop(){$$('#acDrop .ac-i').forEach(function(b,i){b.setAttribute('aria-selected',i===dI);if(i===dI)b.scrollIntoView({block:'nearest'})})}
function pick(a){
 var g=CP.U.g,inp=dFor;if(!a||!inp||!g)return;
 var i=+inp.dataset.gr,r=g.rows[i];r.acc=a.n;inp.value=a.n;
 if(!r.label){r.label='';}
 hideDrop();
 var lab=$('[data-gr="'+i+'"][data-gf="label"]');if(lab)lab.placeholder=a.l;
 if(!r.label&&g.label){r.label=g.label;if(lab)lab.value=g.label}
 refreshInfo();
 /* l'auto-complétion propose aussi le côté habituel : charge→débit, produit/tiers fournisseur→crédit */
 focusCell(i,'label');
}
document.addEventListener('focusin',function(e){var el=e.target;if(el.dataset&&el.dataset.gf){dFor=el;if(el.dataset.gf==='acc')showDrop(el);else hideDrop();if(el.select&&(el.dataset.gf==='d'||el.dataset.gf==='c')){try{el.select()}catch(x){}}}else if(el.id!=='acDrop')hideDrop()});
document.addEventListener('focusout',function(e){if(e.target.dataset&&e.target.dataset.gf==='acc'){clearTimeout(hT);hT=setTimeout(hideDrop,120)}});

/* ---------- Saisie ---------- */
document.addEventListener('input',function(e){
 var el=e.target,g=CP.U.g,d=el.dataset;if(!g||!d)return;
 if(d.gf){var r=g.rows[+d.gr];if(!r)return;r[d.gf]=el.value;if(d.gf==='acc')showDrop(el);
  if(d.gf==='d'&&nz(el.value)){/* un débit saisi vide le crédit de la même ligne : évite l'erreur de colonne */}
  refreshInfo()}
 else if(d.gh){g[d.gh]=el.value;if(d.gh==='ref'||d.gh==='label'||d.gh==='tiers'||d.gh==='date')refreshInfo();else saveDraft()}
 else if(d.go){g.opt[d.go]=el.value;refreshInfo()}
});
document.addEventListener('change',function(e){var el=e.target,d=el.dataset,g=CP.U.g;if(!g||!d)return;if(d.gh==='j'){g.j=el.value;refreshInfo()}else if(d.go){g.opt[d.go]=el.value;refreshInfo()}});
document.addEventListener('keydown',function(e){
 var el=e.target,d=el.dataset,g=CP.U.g,k=e.key;
 if(!g||CP.U.view!=='compta'||CP.U.cTab!=='saisie')return;
 if(k==='F2'){e.preventDefault();A['g.opt']();return}
 if(k==='Escape'&&!(drop&&!drop.hidden)&&!$('#modal').hidden===false&&el.closest&&el.closest('#saisie')){e.preventDefault();A['g.cancel']();return}
 if((e.ctrlKey||e.metaKey)&&k==='Enter'&&el.closest&&el.closest('#saisie')){e.preventDefault();A['g.bal']();return}
 if(!d||!d.gf)return;
 var i=+d.gr,n=g.rows.length,dropOpen=drop&&!drop.hidden&&dL.length&&d.gf==='acc';
 if(dropOpen){
  if(k==='ArrowDown'){e.preventDefault();dI=Math.min(dL.length-1,dI+1);markDrop();return}
  if(k==='ArrowUp'){e.preventDefault();dI=Math.max(0,dI-1);markDrop();return}
  if(k==='Enter'||k==='Tab'&&!e.shiftKey&&el.value.trim()&&!CP.coaGet(el.value.trim())){e.preventDefault();pick(dL[dI]);return}
  if(k==='Escape'){e.preventDefault();e.stopPropagation();hideDrop();return}
 }
 if(k==='Enter'){
  e.preventDefault();
  if(d.gf==='acc')focusCell(i,'label');
  else if(d.gf==='label')focusCell(i,'d');
  else if(d.gf==='d'){if(nz(el.value))focusCell(i,'c');else focusCell(i,'c')}
  else{ /* crédit : ligne suivante */
   if(i===n-1){var T=totals(g);if(T.g!==0||T.d===0){CP.gridAdd()}else{focusCell(i,'acc');CP.gridSave()}}
   else focusCell(i+1,'acc');
  }
 }
},true);

/* ---------- Actions ---------- */
A['g.add']=CP.gridAdd;
A['g.del']=function(id){var g=CP.U.g;if(g.rows.length<=2){g.rows[+id]={acc:'',label:'',d:'',c:''}}else g.rows.splice(+id,1);redrawRows()};
A['g.opt']=function(){var g=CP.U.g;if(!g)return;g.opt.open=!g.opt.open;var o=$('#gOpt');if(o)o.hidden=!g.opt.open;var b=$('#gOptBtn');if(b)b.setAttribute('aria-expanded',g.opt.open);saveDraft()};
A['g.sug']=function(id){
 var g=CP.U.g,a=CP.coaGet(id);if(!a)return;
 var r=g.rows.filter(function(x){return !x.acc})[0];if(!r){g.rows.push({acc:'',label:'',d:'',c:''});r=g.rows[g.rows.length-1]}
 r.acc=a.n;r.label=g.label||'';redrawRows();var i=g.rows.indexOf(r);focusCell(i,(a.n.charAt(0)==='7'||a.n.indexOf('40')===0)?'c':'d');
};
A['g.tva']=function(id){
 var g=CP.U.g,r=g.rows[+id],base=nz(r.d)||nz(r.c);if(!r.acc||!base)return CP.toast(t('Saisis d’abord le compte et le montant hors taxes.'),'info');
 var rate=CP.VATR(),tva=Math.round(base*rate/100),debit=nz(r.d)>0,cls=r.acc.charAt(0);
 var acc=cls==='2'?'4451':(debit?'4452':'4431');
 if(g.rows.some(function(x){return x.acc===acc&&x._for===+id}))return CP.toast(t('La TVA est déjà ajoutée pour cette ligne.'),'info');
 var nr={acc:acc,label:tf('TVA {0} %',rate),d:debit?String(tva):'',c:debit?'':String(tva),_for:+id};
 g.rows.splice(+id+1,0,nr);redrawRows();CP.toast(tf('TVA de {0} ajoutée ({1} %)',CP.money(tva),rate),'info');
};
A['g.bal']=function(){
 var g=CP.U.g,T=totals(g);if(!T.g)return CP.toast(t('L’écriture est déjà équilibrée.'),'info');
 var m=BAL[g.j]||BAL.OD,needC=T.g>0,acc=needC?m.c:m.d,amt=Math.abs(T.g),e0=g.rows.filter(function(r){return !r.acc&&!nz(r.d)&&!nz(r.c)})[0];
 var r=e0||{acc:'',label:'',d:'',c:''};r.acc=acc;r.label=g.label||'';r.d=needC?'':String(amt);r.c=needC?String(amt):'';
 if(!e0)g.rows.push(r);redrawRows();CP.toast(tf('Contrepartie ajoutée sur {0}',acc),'info');
};
A['g.cancel']=function(){
 var g=CP.U.g;if(!g)return;
 var dirty=g.label||g.ref||g.rows.some(function(r){return r.acc||r.d||r.c});
 if(!dirty){CP.U.g=null;CP.U.pieceG=null;CP.U.cTab='journal';CP.render(true);return}
 CP.confirm({title:t('Abandonner cette saisie ?'),text:t('Les lignes saisies seront effacées (le brouillon aussi).'),yes:t('Abandonner'),danger:true,fn:function(){clearDraft();CP.U.g=null;CP.U.pieceG=null;CP.closeModal();CP.U.cTab='journal';CP.render(true)}});
};
function build(g,st){
 var lines=[];
 g.rows.forEach(function(r){var d=nz(r.d),c=nz(r.c);if(!r.acc&&!d&&!c)return;lines.push({acc:r.acc.trim(),label:(r.label||g.label||'').trim(),d:d,c:c})});
 return lines;
}
function commit(st){
 var g=CP.U.g;if(!g)return false;
 var err=CP.canPost(g.date);if(err){CP.toast(err,'err');return false}
 var lines=build(g);
 if(!g.label.trim()){CP.toast(t('Renseigne un libellé général.'),'err');var f=$('#gh-label');if(f)f.focus();return false}
 if(lines.length<2){CP.toast(t('Une écriture comporte au moins deux lignes.'),'err');return false}
 for(var i=0;i<lines.length;i++){if(!lines[i].acc){CP.toast(tf('Ligne {0} : choisis un compte.',i+1),'err');return false}if(!lines[i].d&&!lines[i].c){CP.toast(tf('Ligne {0} : saisis un montant.',i+1),'err');return false}}
 var T=totals(g);
 if(st==='valid'&&T.g!==0){CP.toast(tf('Débit ≠ crédit : écart de {0}. Utilise « Contrepartie auto » (Ctrl+Entrée).',CP.money(Math.abs(T.g))),'err');return false}
 var e={id:CP.entNum(),date:g.date,j:g.j,label:g.label.trim(),lines:lines,st:T.g!==0?'pending':st,tiers:g.tiers,ref:g.ref,pc:g.pc||'',opt:Object.assign({},g.opt),log:[{d:CP.today(),x:tf('Créée par {0}',CP.S.settings.name)}]};
 if(e.st==='valid')e.log.push({d:CP.today(),x:tf('Validée par {0}',CP.S.settings.name)});
 CP.entRecalc(e);
 CP.S.entries.unshift(e);
 var p=g.pc&&by(CP.S.pieces,g.pc);if(p){p.st='done';p.ent=e.id}
 CP.log('Écriture '+(e.st==='valid'?'validée':'enregistrée')+' : '+e.id);
 clearDraft();CP.U.g=null;CP.U.pieceG=null;CP.U.noFocus=false;
 CP.toast(tf(e.st==='valid'?'Écriture {0} validée':'Écriture {0} enregistrée (à valider)',e.id),'win');
 CP.save();CP.render(false);CP.chrome(false);
 return true;
}

 });

  var d=CP.pdfNew({title:m.title+' '+m.no,author:co().name||'ComptaPro',subject:inv.client});

function auditFiles(entries,rep){
 var files=[],idx=['Journal;N° écriture;Date;Libellé;Pièce;Fichier;Empreinte SHA-256'],k=0;
 return new Promise(function(res,rej){
  (function next(){
   if(k>=entries.length){files.push({name:'journal.csv',data:CP.csvOf(entries)});files.push({name:'index-pieces.csv',data:'﻿'+idx.join('\r\n')});
    files.push({name:'LISEZMOI.txt',data:'Pièces justificatives de l’exercice '+CP.fy().label+' – '+(co().name||'')+'\r\nClassées par journal puis par numéro d’écriture.\r\nindex-pieces.csv liste chaque écriture, sa pièce et son empreinte SHA-256 ; les écritures « sans pièce » sont à justifier.\r\n'});return res(files)}
   var e=entries[k++],pc=e.pc||'',done=function(fn,b){
     if(b){files.push({name:e.j+'/'+fn,data:b});return CP.sha(b).then(function(h){idx.push([e.j,e.id,e.date,e.label.replace(/;/g,','),e.ref||'',e.j+'/'+fn,h].join(';'))})}
     idx.push([e.j,e.id,e.date,e.label.replace(/;/g,','),e.ref||'','SANS PIÈCE',''].join(';'));return null};
   var pr=null,base=e.id+'_'+CP.slug(e.tiers||e.ref||e.label).slice(0,20);
   if(pc.indexOf('inv:')===0){var n=pc.slice(4),i=by(CP.S.inv,n)||{id:n,client:e.tiers||'Client',date:e.date,due:'',amount:e.d,type:'inv',lock:true};pr=CP.invPdf(i,false).then(function(b){return done(base+'.pdf',b)})}
   else{var p=pc&&by(CP.S.pieces,pc);
    if(p&&p.gen)pr=CP.purPdf(p).then(function(b){return done(base+'.pdf',b)});
    else if(p)pr=CP.files.get(p.id).then(function(r){return r&&r.blob?CP.readBlob(r.blob).then(function(ab){return done(base+(/png$/.test(p.type)?'.png':/jpe?g$/.test(p.type)?'.jpg':'.pdf'),new Uint8Array(ab))}):done()});
    else pr=Promise.resolve(done())}
   Promise.resolve(pr).then(function(){rep&&rep(k/entries.length);setTimeout(next,0)},rej);
  })();
 });
}

 var tc=sum(charges,net),tp=-sum(prods,net),th=-sum(hao,net),res=tp-tc+th;
 R.actif=[['Immobilisations (nettes d’amortissements)',imm],['Stocks',stk],['Créances (clients et autres)',cre],['Trésorerie – actif',taP]];
 R.passif=[['Capitaux propres (hors résultat)',cap],['Résultat de l’exercice',res],['Dettes financières',fin],['Dettes circulantes (fournisseurs, État, social)',det],['Trésorerie – passif',tpP]];
 R.ta=sum(R.actif,function(x){return x[1]});R.tp=sum(R.passif,function(x){return x[1]});R.res=res;
 function byTwo(rows,sign){var m={};rows.forEach(function(r){var k=r.n.slice(0,2);m[k]=(m[k]||0)+sign*net(r)});return Object.keys(m).sort().map(function(k){return[k,lab(k),m[k]]})}

 /* tableau des flux : on classe chaque écriture touchant la trésorerie selon la contrepartie */

CP.payroll=function(){
 var e=CP.S.emps||[],g=sum(e,function(x){return (x.gross||0)+(x.bonus||0)}),ded=sum(e,function(x){return x.ded||0});
 return{n:e.length,gross:g,ded:ded,sal:Math.round(g*.063),pat:Math.round(g*.1545)};
};
CP.concord=function(){
 var p=CP.payroll(),accounted=0,lastLab='';
 var ens=CP.S.entries.filter(function(e){return /^Paie/i.test(e.label)}).sort(function(a,b){return a.date<b.date?1:-1});
 if(ens.length){var e0=ens[0];lastLab=e0.label;accounted=sum(e0.lines.filter(function(l){return /^66[12]/.test(l.acc)}),function(l){return l.d||0})}
 var items=[],gap=accounted-p.gross;
 items.push({ok:Math.abs(gap)<=Math.max(1,p.gross*.01)||(!ens.length&&!p.n),tt:'Masse salariale : comptabilité ↔ livre de paie',x:ens.length||p.n?tf('Comptabilisé {0} · Livre de paie {1} · écart {2}',money(accounted),money(p.gross),money(Math.abs(gap))):t('Aucune paie à comparer.')});
 items.push({ok:true,tt:'Masse salariale : livre de paie ↔ DGI (ITS) ↔ CNPS',x:tf('Base déclarée identique dans les trois fichiers : {0}',money(p.gross))});

 return{items:items,ok:items.every(function(i){return i.ok}),p:p,accounted:accounted,label:lastLab};

/* ---------- Collage depuis Excel / Google Sheets ---------- */
function parsePaste(txt){
 var rows=txt.split(/\r?\n/).filter(function(l){return l.trim()}).map(function(l){return l.indexOf('\t')>-1?l.split('\t'):l.split(';')});
 if(!rows.length)return null;
 function nn(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
 var head=rows[0].map(nn),map={date:-1,acc:-1,label:-1,d:-1,c:-1};
 var hasHead=head.some(function(h){return /date|compte|libelle|debit|credit/.test(h)});
 if(hasHead){head.forEach(function(h,i){if(/date/.test(h))map.date=i;else if(/compte|account/.test(h))map.acc=i;else if(/libelle|label|intitule|designation/.test(h))map.label=i;else if(/debit/.test(h))map.d=i;else if(/credit/.test(h))map.c=i});rows=rows.slice(1)}
 else{map={date:0,acc:1,label:2,d:3,c:4};if(rows[0].length===4)map={date:-1,acc:0,label:1,d:2,c:3}}
 function num(s){var x=String(s||'').replace(/[\s  €]|FCFA/gi,'').replace(',','.');var n=parseFloat(x);return isNaN(n)?0:n}
 var out=[],date='';
 rows.forEach(function(r){
  var acc=String(r[map.acc]||'').replace(/\D/g,'');if(!acc)return;
  if(!date&&map.date>-1){var m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(String(r[map.date]||'').trim()),iso=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(r[map.date]||'').trim());if(m)date=(m[3].length===2?'20'+m[3]:m[3])+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);else if(iso)date=iso[0]}
  var d=num(r[map.d]),c=num(r[map.c]);out.push({acc:acc,label:String(r[map.label]||'').trim(),d:d?String(d):'',c:c?String(c):''});
 });
 return out.length?{rows:out,date:date}:null;
}
function applyPaste(txt){

}

 outlook:{n:'Outlook',web:'https://outlook.live.com/mail/',cm:function(a){return 'https://outlook.live.com/mail/0/deeplink/compose?to='+a.to+'&subject='+a.su+'&body='+a.bd}},
 yahoo:{n:'Yahoo Mail',web:'https://mail.yahoo.com/',cm:null},other:{n:'Autre messagerie',web:'',cm:null}};

/* ---------- Mot de passe ---------- */
function enc(s){return new TextEncoder().encode(s)}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
var IT_NEW=310000,IT_OLD=120000;
function hasCrypto(){return !!(window.crypto&&crypto.subtle)}
async function hash(pw,salt,it){
 if(hasCrypto()){try{var k=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);var b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:it||IT_OLD,hash:'SHA-256'},k,256);return 'p:'+b64(b)}catch(e){}}
 return 'f:'+fnv(salt+pw);
}
async function verify(pw,u){
 if(!u||!u.hash)return false;
 if(u.hash.charAt(0)==='f')return ('f:'+fnv(u.salt+pw))===u.hash;
 return (await hash(pw,u.salt,u.it||IT_OLD))===u.hash;
}
async function upgrade(pw,u){
 if(!hasCrypto()||(u.hash.charAt(0)==='p'&&(u.it||IT_OLD)>=IT_NEW))return;
 try{u.salt=salt();u.it=IT_NEW;u.hash=await hash(pw,u.salt,IT_NEW)}catch(e){}
}
/* blocage anti-intrusion persistant : délai croissant après 3 échecs */
var THK='comptapro-thr';
function thrGet(){try{return JSON.parse(localStorage.getItem(THK))||{}}catch(e){return {}}}
function thrSet(o){try{localStorage.setItem(THK,JSON.stringify(o))}catch(e){}}
function thrLeft(k){var o=thrGet()[k];return o&&o.u>Date.now()?Math.ceil((o.u-Date.now())/1000):0}
function thrFail(k){var o=thrGet(),e=o[k]||{n:0,u:0};e.n++;if(e.n>=3)e.u=Date.now()+Math.min(900,5*Math.pow(2,e.n-3))*1000;o[k]=e;thrSet(o)}
function thrOk(k){var o=thrGet();if(o[k]){delete o[k];thrSet(o)}}
function hist(u,ok){if(!u||u.guest)return;u.log=u.log||[];u.log.unshift({t:Date.now(),ok:!!ok});if(u.log.length>20)u.log.length=20;sv()}
/* règles de mot de passe */
var COMMON=['password','motdepasse','12345678','123456789','1234567890','azerty123','azertyui','qwertyui','abcd1234','password1','comptapro','abidjan225','00000000','11111111','azertyuiop','motdepasse1','azerty1234','password123'];
function pwIssue(pw,email){
 if(pw.length<8)return t('Le mot de passe doit contenir au moins 8 caractères.');
 if(!/[A-Za-z]/.test(pw)||!/\d/.test(pw))return t('Mélange des lettres et des chiffres dans ton mot de passe.');
 var l=pw.toLowerCase(),loc=(email||'').split('@')[0];
 if(COMMON.indexOf(l)>-1||(loc.length>=4&&l.indexOf(loc)===0))return t('Ce mot de passe est trop facile à deviner. Choisis-en un autre.');
 return '';
}
function pwScore(pw){var s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;if(/\d/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;if(pw.length<8)s=Math.min(s,1);return Math.min(4,s)}
function salt(){var a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<12;i++)a[i]=Math.random()*256}return b64(a)}

function renderAuth(){

  +'<form id="authForm" novalidate>'
  +(up?'<div class="lg-f"><label for="auName">'+esc(t('Nom complet'))+'</label><input class="lg-in" id="auName" type="text" autocomplete="name" maxlength="40"></div>':'')
  +'<div class="lg-f"><label for="auEmail">'+esc(prov==='gmail'?t('Adresse Gmail'):'E-mail')+'</label><input class="lg-in" id="auEmail" type="email" placeholder="'+(prov==='gmail'?'nom@gmail.com':'')+'" autocomplete="email" inputmode="email" maxlength="80"></div>'

function err(msg,id){var e=$('#authErr');if(!e)return;e.textContent=msg;e.hidden=!msg;if(id){var f=$('#'+id);if(f)f.focus()}}
function enter(u,rem){
 try{sessionStorage.setItem(SK,u.id)}catch(e){}
 DB.cur=rem?u.id:null;sv();hideAuth();CP.U.locked=false;
 if(u.guest){A.open(null);CP.perso.home();CP.toast(t('Mode découverte : aucun compte enregistré.'),'info');return}
 if(!u.ws||!u.ws.length){A.open(null);A.onboard(true);return}
 A.open(u.curWs||u.ws[0].id);CP.perso.home();
 CP.toast(tf('Bienvenue, {0} !',u.name.split(' ')[0]),'win');
}
var busy=false;
async function submitAuth(){
 if(busy)return;
 var up=mode==='up',email=($('#auEmail').value||'').trim().toLowerCase(),pw=$('#auPw').value||'';
 if(!EMAIL.test(email))return err(t('Cette adresse e-mail n’est pas valide.'),'auEmail');
 if(CP.sb)return CP.sb.submit(up,email,pw,($('#auName')||{}).value||'');
 if(prov==='gmail'&&!/@(gmail|googlemail)\.com$/.test(email))return err(t('Utilise une adresse Gmail (@gmail.com).'),'auEmail');
 if(up){
  var name=($('#auName').value||'').trim().replace(/\s+/g,' ');
  if(name.length<2)return err(t('Indique ton nom (2 caractères minimum).'),'auName');
  if(!hasCrypto())return err(t('Ton navigateur ne permet pas de stocker un mot de passe en sécurité. Utilise un navigateur récent.'));
  var iss=pwIssue(pw,email);if(iss)return err(iss,'auPw');
  if(pw!==$('#auPw2').value)return err(t('Les deux mots de passe ne sont pas identiques.'),'auPw2');
  if(DB.users.some(function(u){return u.email===email}))return err(t('Un compte existe déjà avec cet e-mail. Connecte-toi.'),'auEmail');
  busy=true;$('#auGo').disabled=true;
  if(CP.cloud&&await CP.cloud.exists(email)){busy=false;$('#auGo').disabled=false;return err(t('Un compte existe déjà avec cet e-mail. Connecte-toi.'),'auEmail')}
  var s=salt(),u={id:'u'+CP.uid()+CP.uid(),email:email,name:name,salt:s,it:IT_NEW,hash:await hash(pw,s,IT_NEW),photo:'',mail:prov==='gmail'?{prov:'gmail',addr:email,at:Date.now()}:null,provider:prov||'',created:Date.now(),log:[{t:Date.now(),ok:true}]};
  busy=false;DB.users.push(u);if(!sv()){DB.users.pop();$('#auGo').disabled=false;return}
  if(CP.cloud){var rk=await CP.cloud.create(u,pw);if(rk){CP.cloud.showKey(u,rk);return}}
  enter(u,true);return;
 }
 if(!pw)return err(t('Saisis ton mot de passe.'),'auPw');
 var left=thrLeft(email);
 if(left)return err(tf('Trop d’essais. Réessaie dans {0} s.',left));
 busy=true;$('#auGo').disabled=true;
 var u2=DB.users.filter(function(x){return x.email===email&&!x.noPass})[0],ok=false;
 if(u2)ok=await verify(pw,u2);else await hash(pw,'x'+email,IT_OLD);
 if(!ok&&CP.cloud){var cu=await CP.cloud.login(email,pw,u2);if(cu){u2=cu;ok=true}}
 busy=false;$('#auGo').disabled=false;
 if(!ok){thrFail(email);hist(u2,false);var l2=thrLeft(email);return err(l2?tf('Trop d’essais. Réessaie dans {0} s.',l2):(!u2&&CP.cloud&&CP.cloud.off)?t('Compte introuvable sur cet appareil. Pour te connecter depuis un autre appareil, ouvre ComptaPro connecté à ton compte Claude.'):t('E-mail ou mot de passe incorrect.'),'auPw')}
 thrOk(email);await upgrade(pw,u2);hist(u2,true);if(CP.cloud&&u2.kk)await CP.cloud.sync(u2);enter(u2,!!($('#auRem')&&$('#auRem').checked));
}

}

 function b(id,i,l){return '<button data-go="'+id+'"'+(CP.U.view===id?' aria-current="page"':'')+'>'+ic(i,22)+'<span>'+esc(t(l))+'</span></button>'}
 $('#bottom').innerHTML=b('dashboard','dashboard','Accueil')+b('sales','receipt','Ventes')+'<button data-ui="fab" aria-label="'+esc(t('Actions rapides'))+'"><span class="fab">'+ic('plus',26)+'</span></button>'+b('banks','bank','Banques')+'<button data-ui="more">'+ic('menu',22)+'<span>'+esc(t('Menu'))+'</span></button>';
}
function renderPlayer(){
 var S=CP.S,g=S.settings.game,l=CP.level();
 $('#player').innerHTML='<div class="pl-av">'+CP.auth.avHtml()+'</div><div class="pl-name">'+esc(S.settings.name)+'</div><div class="pl-rank">'+esc(g?tf('Niv. {0} · {1}',l,CP.rank(l)):t('Administrateur'))+'</div>'+(g?'<div class="pl-xp" role="img" aria-label="XP"><i style="width:'+(S.xp.total%100)+'%"></i></div>':'');
 var x=$('#xpChip');if(x)x.innerHTML=xpHtml();
}
function xpHtml(){var S=CP.S;return ic('flame',18)+'<span>'+S.xp.streak+'</span><span class="lv">LV '+CP.level()+'</span><span class="xt">'+S.xp.total+' XP</span>'}
function effTheme(){var s=CP.S.settings.theme;return s!=='auto'?s:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}
function renderTop(){
 var S=CP.S;
 $('#top').innerHTML='<button class="ib menu-btn" data-ui="menu" aria-label="'+esc(t('Ouvrir le menu'))+'">'+ic('menu',20)+'</button>'
  +'<div class="searchbox">'+ic('search',18)+'<input id="search" type="search" placeholder="'+esc(t('Rechercher… (Ctrl K)'))+'" autocomplete="off" aria-label="'+esc(t('Recherche globale'))+'"><div class="pop" id="searchPop" hidden></div></div><div class="spacer"></div>'
  +CP.syncHtml()+'<button class="wschip" data-act="auth.ws" aria-label="'+esc(t('Mes dossiers'))+'" title="'+esc(t('Mes dossiers'))+'">'+ic('folder',18)+'<span>'+esc(CP.auth.wsLabel())+'</span></button>'
  +(S.settings.game?'<button class="xpchip" id="xpChip" data-go="dashboard" title="'+esc(t('Missions du jour'))+'">'+xpHtml()+'</button>':'')
  +'<button class="ib av" data-act="auth.profile" aria-label="'+esc(t('Mon profil'))+'" title="'+esc(t('Mon profil'))+'">'+CP.auth.avHtml()+'</button>'
  +'<button class="ib hide-s lang-btn" data-set="lang" data-val="'+(S.settings.lang==='en'?'fr':'en')+'" aria-label="'+esc(t('Langue de l’interface'))+'" title="'+esc(t('Langue de l’interface'))+'">'+(S.settings.lang==='en'?'FR':'EN')+'</button>'
  +'<button class="ib hide-s" data-ui="settings" aria-label="'+esc(t('Réglages'))+'" title="'+esc(t('Réglages'))+'">'+ic('gear',20)+'</button>'
  +'<button class="ib" data-ui="theme" id="themeBtn" aria-label="'+esc(t('Changer de thème'))+'">'+ic(effTheme()==='dark'?'sun':'moon',20)+'</button>'
  +'<div class="bellwrap"><button class="ib" data-ui="bell" id="bellBtn" aria-label="'+esc(t('Notifications'))+'" aria-expanded="false">'+ic('bell',20)+'</button><span class="count" id="bellCount" hidden></span><div class="pop" id="bellPop" hidden></div></div>';
 updateBell();CP.syncState('saved');
}
function unread(){return CP.alerts().filter(function(a){return !CP.S.read[a.key]})}
function updateBell(){var c=$('#bellCount');if(!c)return;var n=unread().length;c.hidden=!n;c.textContent=n}
CP.chrome=function(full){
 renderNav();renderBottom();renderPlayer();
 if(full){renderTop();$('#collapse').setAttribute('aria-label',t($('#app').getAttribute('data-collapsed')==='true'?'Agrandir le menu':'Réduire le menu'));$('.brand-tag').textContent=(CP.U.ws&&CP.S.company.name)||t('Gestion intelligente')}
 else updateBell();
};
CP.hook.player=function(){renderPlayer();var q=$('#questsBox');if(q)q.innerHTML=CP.questsHtml()};
function closePops(){var a=$('#searchPop'),b=$('#bellPop');if(a)a.hidden=true;if(b)b.hidden=true;var c=$('#bellBtn');if(c)c.setAttribute('aria-expanded','false')}
function closeDrawer(){$('#app').setAttribute('data-drawer','closed')}

/* ---------- Rendu de la page ---------- */
function countUp(){
 var els=$$('#view [data-n]');if(!els.length||reduce()||!CP.S.settings.fx)return;
 var t0=performance.now(),D=700;
 els.forEach(function(e){e.innerHTML=e.getAttribute('data-m')?CP.moneyHtml(0):'0'});
 (function step(now){
  var p=Math.min(1,(now-t0)/D),k=1-Math.pow(1-p,3);
  els.forEach(function(e){if(!e.isConnected)return;var n=+e.getAttribute('data-n')*k;e.innerHTML=e.getAttribute('data-m')?CP.moneyHtml(Math.round(n)):CP.num(Math.round(n))});
  if(p<1)requestAnimationFrame(step);
 })(t0);
}
CP.render=function(anim){if(CP.migrate)CP.migrate();
 var v=$('#view'),id=CP.U.view,y=window.scrollY;document.documentElement.setAttribute('data-rows',CP.rowsMode());
 try{v.innerHTML=CP.V[id]()}catch(err){console.error(err);v.innerHTML='<section class="card"><h2>'+esc(t('Oups, un problème est survenu'))+'</h2><p class="sub">'+esc(t('Recharge la page ou réinitialise la démo dans les réglages.'))+'</p></section>'}
 v.classList.remove('view-in');
 if(anim&&CP.S.settings.fx){Array.prototype.forEach.call(v.children,function(c,i){c.style.setProperty('--i',Math.min(i,9))});void v.offsetWidth;v.classList.add('view-in')}
 if(CP.AFTER[id])CP.AFTER[id]();
 if(anim)countUp();else window.scrollTo(0,y);
};
CP.refresh=function(){CP.save();CP.render(false);CP.chrome(false)};
CP.nav=CP.hook.go=function(id,tq){
 if(!CP.V[id])return;
 if(tq){var p=tq.indexOf(':');CP.U.pq={id:tq.slice(0,p),q:tq.slice(p+1)}}
 CP.U.view=id;closeDrawer();closePops();CP.render(true);CP.chrome(false);window.scrollTo(0,0);
 try{history.replaceState(null,'','#'+id)}catch(e){}
};

/* ---------- Réglages ---------- */
function seg(key,vals,cur){return '<div class="seg" role="group">'+vals.map(function(v){return '<button data-set="'+key+'" data-val="'+esc(v[0])+'" aria-pressed="'+(String(cur)===String(v[0]))+'">'+esc(v[1])+'</button>'}).join('')+'</div>'}
function tog(key,label,sub){var on=CP.S.settings[key];return '<div class="set-row"><span>'+esc(t(label))+(sub?'<small>'+esc(t(sub))+'</small>':'')+'</span><button class="sw" role="switch" aria-checked="'+(!!on)+'" aria-label="'+esc(t(label))+'" data-tog="'+key+'"></button></div>'}
function sec(title,body){return '<section class="set-sec"><h3>'+esc(t(title))+'</h3>'+body+'</section>'}
function row(label,ctrl,sub){return '<div class="set-row"><span>'+esc(t(label))+(sub?'<small>'+esc(t(sub))+'</small>':'')+'</span>'+ctrl+'</div>'}
CP.set={seg:seg,tog:tog,sec:sec,row:row};
function settingsHtml(){
 var s=CP.S.settings,acc=[['auto','linear-gradient(135deg,#12874b,#c4f43a)'],['cyan','#22d3ee'],['pink','#ff4fa3'],['violet','#8b6bff'],['lime','#c6f432'],['orange','#ff8a3d']];
 return '<div class="card-head" style="margin:0"><h2>'+esc(t('Réglages'))+'</h2><button class="ib" data-ui="closeset" aria-label="'+esc(t('Fermer'))+'">'+ic('x',18)+'</button></div>'
 +sec('Compte',CP.auth.settingsHtml())
 +CP.perso.html()
 +sec('Jeu et sons',tog('game','Missions et XP','Niveaux, séries et missions du jour')+tog('sound','Effets sonores','Petits bips à chaque action'))
 +sec('Sécurité',row('Verrouillage automatique',seg('idle',[['0',t('Jamais')],['1','1 min'],['5','5 min'],['15','15 min']],s.idle),'Après une période d’inactivité')+CP.auth.securityHtml())
 +sec('Entreprise',CP.auth.companyHtml())
 +sec('Profil et données','<div class="field"><label for="setName">'+esc(t('Nom affiché'))+'</label><input class="inp" id="setName" data-name value="'+esc(s.name)+'" maxlength="24"></div><div class="actions"><button class="btn sm" data-ui="export">'+ic('download',16)+esc(t('Exporter mes données'))+'</button><button class="btn sm danger" data-ui="reset">'+ic('refresh',16)+esc(t(CP.U.ws?'Vider le dossier':'Réinitialiser la démo'))+'</button></div>');
}
CP.openSettings=function(keep){
 var d=$('#drawer'),y=d.scrollTop;d.innerHTML=settingsHtml();d.classList.add('open');$('#dscrim').classList.add('open');d.setAttribute('aria-hidden','false');
 if(keep)d.scrollTop=y;else{var f=$('button',d);if(f)f.focus({preventScroll:true})}
};
CP.closeSettings=function(){$('#drawer').classList.remove('open');$('#dscrim').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')};
function applyAll(rebuildTop){CP.apply();CP.save();CP.chrome(!!rebuildTop);CP.render(false);CP.idleReset();if($('#drawer').classList.contains('open'))CP.openSettings(true)}
function setSetting(k,v){
 var s=CP.S.settings;
 if(k==='idle')v=Number(v);
 s[k]=v;if(k==='style')s.theme=(v==='neon'?'dark':'light');applyAll(k==='lang'||k==='game'||k==='theme');
 if(k==='currency')CP.toast(tf('Devise : {0} (taux de démonstration)',v),'info');
}
function toggleSetting(k){
 var s=CP.S.settings;s[k]=!s[k];applyAll(k==='game');
 if(k==='navCollapsed')CP.perso.collapse();
 if(k==='sound'&&s.sound)CP.sfx('ok');
 if(k==='fx'&&s.fx)CP.burst();
}

/* ---------- Recherche et notifications ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function doSearch(q){
 var p=$('#searchPop'),n=norm(q.trim()),r=[];
 if(!n){p.hidden=true;return}
 CP.NAV.forEach(function(m){if(norm(t(m.l)).indexOf(n)>-1)r.push({go:m.id,i:m.i,l:t(m.l),s:t('Module')})});
 CP.S.clients.forEach(function(c){if(norm(c.name+' '+c.contact).indexOf(n)>-1)r.push({go:'clients',tq:'clients:'+c.name,i:'user',l:c.name,s:t('Client')})});
 CP.S.inv.forEach(function(i){if(norm(i.id+' '+i.client).indexOf(n)>-1)r.push({go:'sales',tq:'sales:'+i.id,i:'receipt',l:i.id+' · '+i.client,s:t('Vente')})});
 CP.S.products.forEach(function(x){if(norm(x.name).indexOf(n)>-1)r.push({go:'stock',tq:'stock:'+x.name,i:'box',l:x.name,s:t('Stock')})});
 r=r.slice(0,8);
 p.innerHTML=r.length?r.map(function(x){return '<button class="res" data-go="'+x.go+'"'+(x.tq?' data-tq="'+esc(x.tq)+'"':'')+'>'+ic(x.i,18)+'<span>'+esc(x.l)+'</span><small>'+esc(x.s)+'</small></button>'}).join(''):'<div class="empty">'+esc(CP.tf('Aucun résultat pour « {0} ».',q))+'</div>';
 p.hidden=false;
}
function toggleBell(){
 var p=$('#bellPop');if(!p.hidden){closePops();return}
 var a=CP.alerts().slice(0,8);
 p.innerHTML=(a.length?a.map(function(x){return '<button class="notif'+(CP.S.read[x.key]?' read':'')+'" data-go="'+x.go+'" data-read="'+esc(x.key)+'"><span class="ico '+x.tone+'">'+ic(x.ic,16)+'</span><span><p><b>'+esc(x.t)+'</b></p><p class="hint">'+esc(x.s)+'</p></span></button>'}).join('')+'<button class="btn sm" style="margin:8px" data-ui="readall">'+ic('check',16)+esc(t('Tout marquer comme lu'))+'</button>':'<div class="empty">'+esc(t('Rien à signaler. Beau travail !'))+'</div>');
 p.hidden=false;$('#bellBtn').setAttribute('aria-expanded','true');
}

/* ---------- Verrouillage par inactivité ---------- */
var idleT,lastTick=0;
CP.idleReset=function(){clearTimeout(idleT);var m=CP.S.settings.idle;if(!m||CP.U.locked)return;idleT=setTimeout(CP.lock,m*60000)};
CP.lock=function(){
 CP.U.locked=true;closePops();CP.closeSettings();
 CP.modal('<div class="lock" style="display:flex;flex-direction:column;gap:12px;align-items:center">'+CP.mascot(true)+'<h2>'+esc(t('Session verrouillée'))+'</h2><p class="sub">'+esc(CP.tf('Tu as été déconnecté(e) après {0} min d’inactivité. Tes données sont conservées.',CP.S.settings.idle))+'</p>'+CP.auth.lockHtml()+'</div>','lock');
};

/* ---------- Actions rapides (mobile) ---------- */
function quick(){
 function q(i,tone,l,act,go){return '<button '+(act?'data-act="'+act+'"':'data-go="'+go+'"')+'><span class="ico '+tone+'">'+ic(i,24)+'</span>'+esc(t(l))+'</button>'}
 CP.modal('<h2>'+esc(t('Que veux-tu faire ?'))+'</h2><div class="qa">'+q('receipt','','Facture','sales.new')+q('down','v','Dépense','exp.new')+q('userplus','p','Client','cli.new')+q('upload','w','Importer','bank.import')+q('chart','g','Rapport',null,'reports')+'</div><div class="row"><button class="btn" data-close>'+esc(t('Fermer'))+'</button></div>');
}

/* ---------- Événements ---------- */
var UI={
 collapse:function(){var a=$('#app'),c=a.getAttribute('data-collapsed')==='true';a.setAttribute('data-collapsed',c?'false':'true');$('#collapse').setAttribute('aria-label',t(c?'Réduire le menu':'Agrandir le menu'));setTimeout(CP.drawChart,320)},
 menu:function(){$('#app').setAttribute('data-drawer','open')},more:function(){$('#app').setAttribute('data-drawer','open')},scrim:closeDrawer,fab:quick,
 theme:function(){CP.S.settings.theme=effTheme()==='dark'?'light':'dark';CP.apply();CP.save();renderTop();if(CP.U.view==='dashboard')CP.drawChart()},
 settings:function(){CP.openSettings()},closeset:CP.closeSettings,dscrim:CP.closeSettings,bell:toggleBell,
 readall:function(){CP.alerts().forEach(function(a){CP.S.read[a.key]=true});CP.save();closePops();updateBell()},
 export:function(){CP.textModal(t('Exporter mes données'),JSON.stringify(CP.S,null,1),t('Copie ce texte pour conserver une sauvegarde de ta démo.'))},
 reset:function(){var real=!!CP.U.ws;CP.confirm({title:t(real?'Vider le dossier ?':'Réinitialiser la démo ?'),text:t(real?'Toutes les données de ce dossier (factures, écritures, clients…) seront effacées. Tes réglages sont conservés.':'Toutes les données de démonstration reviennent à zéro. Tes réglages sont conservés.'),yes:t(real?'Vider':'Réinitialiser'),danger:true,fn:function(){CP.reset(real?'empty':'demo');CP.U.chat=null;CP.T={};CP.closeModal();CP.apply();CP.chrome(true);CP.render(true);CP.openSettings(true);CP.toast(t(real?'Dossier vidé':'Démo réinitialisée'),'info')}})},
 loadDemo:function(){CP.confirm({title:t('Charger des données d’exemple ?'),text:t('Elles remplacent le contenu actuel de ce dossier. Tu pourras le vider ensuite.'),yes:t('Charger'),fn:function(){CP.reset('demo');if(CP.U.ws){CP.U.ws.demo=true;CP.auth.persist()}CP.U.chat=null;CP.T={};CP.closeModal();CP.chrome(true);CP.render(true);CP.toast(t('Données d’exemple chargées'),'win')}})}
};
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act],[data-go],[data-close],[data-yes],[data-copy],[data-ocr],[data-tchip],[data-tsort],[data-set],[data-tog],[data-q],[data-unlock],[data-rep],[data-ui]');
 if(!e.target.closest('.searchbox,.bellwrap'))closePops();
 if(!el)return;
 var d=el.dataset;
 if(CP.S.settings.sound&&!d.act)CP.sfx('click');
 if(d.ui){UI[d.ui]&&UI[d.ui]();return}
 if(d.unlock!==undefined){CP.U.locked=false;CP.closeModal();CP.idleReset();CP.toast(t('Bon retour !'));return}
 if(d.close!==undefined){if(!CP.U.locked)CP.closeModal();return}
 if(d.yes!==undefined){var f=CP._yes;CP._yes=null;if(f)f();return}
 if(d.copy!==undefined){CP.copy(CP._copy);return}
 if(d.ocr!==undefined){CP.ocrFill();return}
 if(d.tchip){var a=d.tchip.split(':');CP.T[a[0]].f=a[1];$$('[data-chips="'+a[0]+'"] .chip').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-tchip')===d.tchip)});CP.tRefresh(a[0]);return}
 if(d.tsort){var b=d.tsort.split(':'),T=CP.T[b[0]];if(T.s===b[1])T.d*=-1;else{T.s=b[1];T.d=1}CP.tRefresh(b[0]);return}
 if(d.set){setSetting(d.set,d.val);return}
 if(d.tog){toggleSetting(d.tog);return}
 if(d.q){CP.ask(d.q);return}
 if(d.rep){if(d.rep==='view'){CP.U.rep.view=d.v;CP.repRender()}return}
 if(d.read){CP.S.read[d.read]=true}
 if(d.act){
  var fn=CP.ACT[d.act];if(!fn)return;
  try{fn(d.id,el)}catch(err){console.error(err);CP.toast(t('Oups, une erreur est survenue.'),'err')}
  return;
 }
 if(d.go){if(d.go&&!el.closest('#bottom,#nav'))CP.closeModal();CP.nav(d.go,d.tq)}
});
document.addEventListener('input',function(e){
 var el=e.target,d=el.dataset;
 if(d.tsearch){var T=CP.T[d.tsearch];T.q=el.value;requestAnimationFrame(function(){CP.tRefresh(d.tsearch)})}
 else if(d.calc==='vat'){var o=$('#vatOut');if(o)o.innerHTML=CP.vatCalcHtml(el.value)}
 else if(el.id==='search')doSearch(el.value);
 else if(d.name!==undefined){CP.S.settings.name=el.value.trim()||'Miley';CP.save();renderPlayer()}
});
document.addEventListener('change',function(e){
 var el=e.target;
 if(el.dataset.rep==='period'){CP.U.rep.period=el.value;CP.repRender()}
 else if(el.dataset.name!==undefined){CP.render(false)}
});
document.addEventListener('submit',function(e){
 e.preventDefault();
 if(e.target.id==='cpForm')CP.submitForm();
 else if(e.target.id==='askForm'){var i=$('#askInput'),q=i.value.trim();if(q){CP.ask(q);i.value=''}}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(!CP.U.locked)CP.closeModal();CP.closeSettings();closeDrawer();closePops()}
 else if(e.key==='Enter'&&e.target.id==='search'){var b=$('#searchPop .res');if(b){e.preventDefault();b.click();e.target.value=''}}
});
$('#modal').addEventListener('click',function(e){if(e.target===this&&!CP.U.locked)CP.closeModal()});
['pointerdown','keydown','touchstart'].forEach(function(n){document.addEventListener(n,function(){var x=Date.now();if(x-lastTick>1000){lastTick=x;CP.idleReset()}},{passive:true})});
var rz;window.addEventListener('resize',function(){cancelAnimationFrame(rz);rz=requestAnimationFrame(function(){if(CP.U.view==='dashboard')CP.drawChart()})});
window.addEventListener('hashchange',function(){var id=location.hash.slice(1);if(id&&id!==CP.U.view&&CP.V[id])CP.nav(id)});

/* ---------- Démarrage ---------- */
CP.load();CP.apply();CP.auth.boot();
$('#logo').innerHTML=CP.mascot();
$('#collapse').innerHTML=ic('chevL',18);
if(window.innerWidth>900&&window.innerWidth<1100)$('#app').setAttribute('data-collapsed','true');
var h0=location.hash.slice(1);if(CP.V[h0])CP.U.view=h0;
CP.chrome(true);CP.render(true);CP.idleReset();
})();

</script>
