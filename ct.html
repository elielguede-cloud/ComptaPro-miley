<style>
/* Layout : « manga night ». Barre latérale sombre à gauche ; contenu en cases à contour épais et ombre dure ; trames, rayures et éclairs inspirés des couvertures de manga. Sombre par défaut, papier clair en option. */
:root{
  color-scheme:dark;
  --disp:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Nunito","Segoe UI",system-ui,sans-serif;
  --sfx:"Bangers","Impact","Arial Black",sans-serif;
  --bg:#0b0f2e;--bg2:#10174a;--panel:#151c52;--panel2:#1e2868;
  --fg:#f3f5ff;--muted:#a9b2e0;--ol:#3a47a8;--sh:#03051a;--dot:rgba(255,255,255,.06);
  --pink:#ff4fa3;--cyan:#22d3ee;--violet:#8b6bff;--yellow:#ffd43b;--lime:#c6f432;
  --good:#2ee59d;--warn:#ffc233;--crit:#ff5c7a;
  --acc:#22d3ee;--on-acc:#04222a;
  --acc-t:color-mix(in srgb,var(--acc) 72%,var(--fg));
  --side:#070a22;--side-ol:#1b2468;
  --fs:14px;--pad:20px;--cell:12px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f1efff;--bg2:#e6e3ff;--panel:#ffffff;--panel2:#f6f4ff;
  --fg:#16133d;--muted:#5b6090;--ol:#16133d;--sh:#16133d;--dot:rgba(22,19,61,.1);
  --good:#0fb77a;--warn:#f59e0b;--crit:#e11d48;--yellow:#ffc400}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f1efff;--bg2:#e6e3ff;--panel:#ffffff;--panel2:#f6f4ff;
  --fg:#16133d;--muted:#5b6090;--ol:#16133d;--sh:#16133d;--dot:rgba(22,19,61,.1);
  --good:#0fb77a;--warn:#f59e0b;--crit:#e11d48;--yellow:#ffc400}
:root[data-accent="cyan"]{--acc:#22d3ee;--on-acc:#04222a}
:root[data-accent="pink"]{--acc:#ff4fa3;--on-acc:#2a0618}
:root[data-accent="violet"]{--acc:#8b6bff;--on-acc:#ffffff}
:root[data-accent="lime"]{--acc:#c6f432;--on-acc:#1b2a03}
:root[data-accent="orange"]{--acc:#ff8a3d;--on-acc:#2c1200}
:root[data-fs="s"]{--fs:13px}
:root[data-fs="l"]{--fs:16px}
:root[data-compact="on"]{--pad:14px;--cell:8px}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 var(--fs)/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:14px 14px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
:root[data-fx="off"] *,:root[data-fx="off"] *::before,:root[data-fx="off"] *::after{animation:none!important;transition:none!important}
:root[data-fx="off"] body::before{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes sweep{from{background-position:0 0}to{background-position:56px 0}}

.app{--sw:276px;position:relative;z-index:1;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100%;transition:grid-template-columns .28s cubic-bezier(.2,.8,.2,1)}

/* ---------- Barre latérale ---------- */
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:var(--side);border-right:3px solid var(--side-ol);color:#cfd6ff;z-index:60;overflow:hidden}
.side::before{content:"";position:absolute;inset:0 0 auto 0;height:160px;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,79,163,.16) 0 10px,transparent 10px 22px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.side>*{position:relative}
.brand{display:flex;align-items:center;gap:11px;padding:2px 2px 12px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--acc),var(--pink));border:3px solid #02040f;box-shadow:3px 3px 0 #02040f;display:grid;place-items:center;flex:none;transform:rotate(-4deg);overflow:hidden}
.brand-text{min-width:0;line-height:1.1}
.brand-name{font:400 21px/1 var(--disp);color:#fff;letter-spacing:.01em}
.brand-tag{font-size:12px;color:#8e98d6;margin-top:4px}
.collapse{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#8e98d6;border:2px solid var(--side-ol);flex:none}
.collapse:hover{color:#fff;background:rgba(255,255,255,.06)}
.collapse svg{transition:transform .25s}
.nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:4px 2px 8px;scrollbar-width:thin;scrollbar-color:var(--side-ol) transparent}
.nav-item{display:flex;align-items:center;gap:11px;height:44px;padding:0 10px 0 8px;border-radius:14px;color:#cfd6ff;text-align:left;width:100%;position:relative;flex:none;border:2px solid transparent;transition:transform .15s,background .15s}
.nav-item .ni{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(3px)}
.nav-item[aria-current="page"]{background:var(--acc);color:var(--on-acc);font-weight:800;border-color:#02040f;box-shadow:3px 3px 0 rgba(255,255,255,.28);transform:none}
.nav-item[aria-current="page"] .ni{background:rgba(0,0,0,.16)}
.label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font:400 12px/1 var(--sfx);letter-spacing:.07em;padding:4px 7px 3px;border-radius:8px;border:2px solid #02040f;transform:rotate(-5deg);flex:none}
.b-new{background:var(--yellow);color:#241a00}
.b-team{background:var(--pink);color:#2a0618}
.b-ia{background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff}
.player{margin-top:6px;background:#0e1442;border:2px solid var(--side-ol);border-radius:16px;padding:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:center}
.pl-av{grid-row:span 3;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--pink));border:2px solid #02040f;color:#fff;font:400 20px var(--disp);display:grid;place-items:center}
.pl-name{font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-rank{font-size:12px;color:#aab3ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-xp{height:9px;border-radius:99px;background:#1c2565;overflow:hidden;border:1.5px solid #02040f}
.pl-xp i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--pink));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.scrim{position:fixed;inset:0;background:rgba(2,4,15,.65);z-index:55;display:none}

@media (min-width:901px){
  .app[data-collapsed="true"]{--sw:84px}
  .app[data-collapsed="true"] .brand{flex-direction:column;gap:12px}
  .app[data-collapsed="true"] .collapse{margin-left:0}
  .app[data-collapsed="true"] .collapse svg{transform:rotate(180deg)}
  .app[data-collapsed="true"] .brand-text,.app[data-collapsed="true"] .label,.app[data-collapsed="true"] .pl-name,.app[data-collapsed="true"] .pl-rank{display:none}
  .app[data-collapsed="true"] .nav-item{justify-content:center;padding:0}
  .app[data-collapsed="true"] .badge{position:absolute;top:5px;right:6px;width:10px;height:10px;padding:0;font-size:0;border-radius:50%}
  .app[data-collapsed="true"] .player{grid-template-columns:1fr;justify-items:center;padding:8px 4px}
  .app[data-collapsed="true"] .pl-av{grid-row:auto}
  .app[data-collapsed="true"] .pl-xp{width:100%}
}

/* ---------- Zone principale ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:3px solid var(--ol)}
.ib{width:42px;height:42px;border-radius:13px;border:2.5px solid var(--ol);background:var(--panel);box-shadow:3px 3px 0 var(--sh);display:grid;place-items:center;position:relative;flex:none;transition:transform .12s,box-shadow .12s}
.ib:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh);border-color:var(--acc)}
.ib:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.menu-btn{display:none}
.count{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#2a0618;border:2px solid var(--ol);font:400 13px/16px var(--sfx);text-align:center;padding:0 4px;animation:pop .35s both}
.searchbox{position:relative;flex:1;max-width:460px;min-width:0}
.searchbox>svg{position:absolute;left:13px;top:13px;color:var(--muted);pointer-events:none}
.searchbox input{width:100%;height:42px;border-radius:13px;border:2.5px solid var(--ol);background:var(--panel);padding:0 14px 0 42px;box-shadow:3px 3px 0 var(--sh)}
.searchbox input::placeholder{color:var(--muted)}
.spacer{flex:1}
.xpchip{height:42px;padding:0 12px;border-radius:13px;border:2.5px solid var(--ol);background:var(--panel);box-shadow:3px 3px 0 var(--sh);display:inline-flex;align-items:center;gap:8px;font-weight:800;flex:none}
.xpchip .lv{font:400 16px var(--sfx);letter-spacing:.05em;background:var(--yellow);color:#241a00;border-radius:8px;padding:2px 7px 1px;border:2px solid var(--ol)}
.xpchip svg{color:var(--warn)}
.bellwrap{position:relative;flex:none}

#view{padding:24px;max-width:1380px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.view-in>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}

/* ---------- Navigation basse (mobile) ---------- */
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:3px solid var(--ol);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(5,1fr);align-items:end}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.bottom button[aria-current="page"]{color:var(--acc-t)}
.bottom .fab{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;margin:-28px auto 0;border:3px solid #02040f;box-shadow:3px 3px 0 var(--sh);transition:transform .12s}
.bottom .fab:active{transform:scale(.92)}

@media (max-width:1100px){.xpchip .xt{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:292px;max-width:88vw;height:auto;transform:translateX(-106%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .app[data-drawer="open"] .side{transform:none;box-shadow:8px 0 0 rgba(0,0,0,.35)}
  .app[data-drawer="open"] .scrim{display:block}
  .collapse{display:none}
  .menu-btn{display:grid}
  .top{padding:10px 16px}
}
@media (max-width:700px){
  #view{padding:16px 16px 112px;gap:16px}
  .bottom{display:grid}
  .top .hide-s{display:none}
}
[hidden]{display:none!important}

/* ---------- Titres de page façon « chapitre » ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head>div:first-child{min-width:0}
.chapter{display:inline-flex;align-items:center;gap:8px;font:400 14px/1 var(--sfx);letter-spacing:.1em;background:var(--yellow);color:#241a00;border:2.5px solid var(--sh);padding:5px 10px 3px;border-radius:8px;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--sh)}
.chapter span{font:800 12px var(--body);letter-spacing:0}
h1{font:400 clamp(26px,3.6vw,40px)/1.05 var(--disp);margin-top:12px;text-wrap:balance;text-shadow:3px 3px 0 color-mix(in srgb,var(--acc) 55%,transparent)}
.sub{color:var(--muted);margin-top:8px;max-width:64ch}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Boutons ---------- */
.btn{height:42px;padding:0 16px;border-radius:13px;border:2.5px solid var(--ol);background:var(--panel);box-shadow:3px 3px 0 var(--sh);font-weight:800;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--sh)}
.btn.primary{background:var(--acc);color:var(--on-acc);border-color:var(--sh)}
.btn.danger{background:var(--crit);color:#fff;border-color:var(--sh)}
.btn.sm{height:34px;padding:0 12px;font-size:.92em;border-radius:10px;box-shadow:2px 2px 0 var(--sh)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.ra{width:34px;height:34px;border-radius:10px;border:2px solid var(--ol);background:var(--panel2);display:inline-grid;place-items:center;transition:transform .12s,background .12s}
.ra:hover{background:var(--acc);color:var(--on-acc);transform:translateY(-2px)}
.ra.bad:hover{background:var(--crit);color:#fff}
.rowact{display:flex;gap:6px;justify-content:flex-end}

/* ---------- Cartes ---------- */
.card{background:var(--panel);border:2.5px solid var(--ol);border-radius:20px;padding:var(--pad);box-shadow:5px 5px 0 var(--sh);min-width:0}
.card-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.card h2{font:400 18px/1.2 var(--disp)}
.hint{color:var(--muted);font-size:.92em;margin-top:2px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid-2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;min-width:0}
.tile{background:var(--panel);border:2.5px solid var(--ol);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile .tr{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:.92em}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;border:2px solid var(--sh);background:var(--acc);color:var(--on-acc)}
.ico.v{background:var(--violet);color:#fff}.ico.p{background:var(--pink);color:#2a0618}
.ico.w{background:var(--yellow);color:#241a00}.ico.c{background:var(--crit);color:#fff}.ico.g{background:var(--good);color:#032a1b}
.val{font:400 clamp(18px,1.4vw,23px)/1.2 var(--disp);font-variant-numeric:tabular-nums}
.cu{font:800 .5em var(--body);color:var(--muted);display:inline-block}
.delta{font-size:.88em;font-weight:800;color:var(--muted)}
.delta.up{color:color-mix(in srgb,var(--good) 70%,var(--fg))}.delta.down{color:color-mix(in srgb,var(--crit) 75%,var(--fg))}.delta.warn{color:color-mix(in srgb,var(--warn) 70%,var(--fg))}

/* ---------- Pastilles et barres ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-weight:800;font-size:.85em;white-space:nowrap;border:2px solid currentColor;background:color-mix(in srgb,currentColor 14%,var(--panel))}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{color:color-mix(in srgb,var(--good) 72%,var(--fg))}.p-warn{color:color-mix(in srgb,var(--warn) 72%,var(--fg))}
.p-crit{color:color-mix(in srgb,var(--crit) 78%,var(--fg))}.p-info{color:color-mix(in srgb,var(--violet) 70%,var(--fg))}
.bar{height:12px;border-radius:99px;background:var(--panel2);border:2px solid var(--ol);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(115deg,var(--acc) 0 10px,color-mix(in srgb,var(--acc) 70%,var(--pink)) 10px 20px);background-size:56px 100%;animation:sweep 2s linear infinite;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.bad i{background:repeating-linear-gradient(115deg,var(--crit) 0 10px,color-mix(in srgb,var(--crit) 70%,var(--yellow)) 10px 20px)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:14px;border:2.5px solid;min-width:0;background:var(--panel)}
.banner.crit{border-color:var(--crit)}.banner.crit svg{color:var(--crit)}
.banner.info{border-color:var(--violet)}.banner.info svg{color:var(--violet)}
.banner.warn{border-color:var(--warn)}.banner.warn svg{color:var(--warn)}
.banner p{min-width:0}

/* ---------- Tableaux ---------- */
.tb-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search-in{position:relative;flex:1;min-width:180px;max-width:320px}
.search-in svg{position:absolute;left:11px;top:10px;color:var(--muted);pointer-events:none}
.inp,.search-in input{width:100%;height:42px;border-radius:12px;border:2.5px solid var(--ol);background:var(--panel2);padding:0 12px}
.search-in input{height:38px;padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:999px;border:2px solid var(--ol);background:var(--panel2);font-weight:800;font-size:.9em;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--sh)}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;min-width:620px;font-variant-numeric:tabular-nums}
th{font:400 14px var(--sfx);letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px var(--cell);border-bottom:3px solid var(--ol);white-space:nowrap}
th[data-tsort]{cursor:pointer;user-select:none}
th[data-tsort]:hover{color:var(--acc-t)}
td{padding:var(--cell);border-bottom:2px dashed color-mix(in srgb,var(--ol) 55%,transparent);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
td small{display:block;color:var(--muted)}
.in{color:color-mix(in srgb,var(--good) 70%,var(--fg));font-weight:800}.out{color:color-mix(in srgb,var(--crit) 75%,var(--fg));font-weight:800}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* ---------- Formulaires ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.field>label{font-weight:800;font-size:.92em}
.field .fh{color:var(--muted);font-size:.85em}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:2px solid var(--ol);background:var(--panel2);font-weight:700;font-size:.9em;cursor:pointer}
.chk input{accent-color:var(--acc)}
.ferr{padding:10px 12px;border-radius:12px;border:2.5px solid var(--crit);background:color-mix(in srgb,var(--crit) 14%,var(--panel));font-weight:700;animation:shake .35s}

/* ---------- Fenêtres ---------- */
.modal{position:fixed;inset:0;z-index:90;background:rgba(2,4,15,.7);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:3px solid var(--ol);border-top:10px solid var(--acc);border-radius:22px;box-shadow:7px 7px 0 var(--sh);width:min(520px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:92dvh;overflow:auto;animation:pop .3s both}
.sheet.wide{width:min(860px,100%)}
.sheet h2{font:400 22px/1.15 var(--disp)}
.sheet .sub{margin-top:0}
.sheet .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet pre,.sheet textarea.mono{font:600 12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--panel2);border:2px solid var(--ol);border-radius:12px;padding:12px;overflow:auto;max-height:240px;white-space:pre;margin:0;width:100%}
.pop{position:absolute;z-index:70;background:var(--panel);border:2.5px solid var(--ol);border-radius:16px;box-shadow:5px 5px 0 var(--sh);padding:8px;animation:pop .2s both}
.searchbox .pop{left:0;right:0;top:50px}
.bellwrap .pop{right:0;top:50px;width:min(360px,calc(100vw - 32px))}
.pop .res{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}
.pop .res:hover{background:var(--panel2)}
.pop .res small{color:var(--muted);margin-left:auto}
.pop .empty{padding:12px}
.notif{display:flex;gap:10px;padding:10px;border-radius:12px;align-items:flex-start;width:100%;text-align:left}
.notif:hover{background:var(--panel2)}
.notif.read{opacity:.55}
.notif p{font-size:.92em}
.notif .ico{width:32px;height:32px;border-radius:10px}

/* ---------- Réglages ---------- */
.dscrim{position:fixed;inset:0;z-index:94;background:rgba(2,4,15,.6);visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s}
.dscrim.open{visibility:visible;opacity:1;transition:opacity .25s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:95;background:var(--panel);border-left:3px solid var(--ol);box-shadow:-6px 0 0 var(--sh);overflow:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));visibility:hidden;transform:translateX(106%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;display:flex;flex-direction:column;gap:18px}
.drawer.open{visibility:visible;transform:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer h2{font:400 24px var(--disp)}
.set-sec{display:flex;flex-direction:column;gap:12px;padding:14px;border:2.5px solid var(--ol);border-radius:16px;background:var(--panel2)}
.set-sec h3{font:400 15px var(--sfx);letter-spacing:.1em;color:var(--acc-t)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set-row>span{font-weight:700;min-width:0}
.set-row small{display:block;color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--panel);border:2px solid var(--ol);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:9px;font-weight:800;font-size:.9em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.sw{width:50px;height:28px;border-radius:99px;border:2.5px solid var(--ol);background:var(--panel);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .15s}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-acc)}
.swatches{display:flex;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--ol);transition:transform .12s}
.swatches button:hover{transform:scale(1.12)}
.swatches button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)}

/* ---------- Notifications « onomatopées » ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:120;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:min(430px,calc(100vw - 32px));background:var(--panel);border:2.5px solid var(--ol);box-shadow:4px 4px 0 var(--sh);border-radius:16px;padding:8px 14px 8px 6px;font-weight:700;animation:pop .35s both}
.toast .sfx{font:400 19px/1 var(--sfx);letter-spacing:.04em;padding:16px 15px 14px;min-width:78px;text-align:center;background:var(--yellow);color:#241a00;flex:none;clip-path:polygon(50% 0,61% 14%,79% 6%,80% 25%,98% 30%,88% 46%,100% 60%,82% 68%,86% 88%,66% 82%,50% 100%,36% 84%,16% 90%,18% 70%,0 60%,12% 45%,2% 28%,20% 24%,22% 6%,38% 15%)}
.toast.k-err .sfx{background:var(--crit);color:#fff}
.toast.k-win .sfx{background:var(--pink);color:#2a0618}
.toast.k-info .sfx{background:var(--acc);color:var(--on-acc)}
.toast.out{opacity:0;transform:translateX(20px);transition:.3s}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:130}

/* ---------- Accueil : case héros, missions ---------- */
.hero{position:relative;overflow:hidden;border:3px solid var(--ol);border-radius:24px;box-shadow:6px 6px 0 var(--sh);background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 30%,var(--panel)),var(--panel) 62%);padding:calc(var(--pad) + 6px) calc(var(--pad) + 10px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;outline:2px solid color-mix(in srgb,var(--fg) 65%,transparent);outline-offset:-10px}
.hero::before{content:"";position:absolute;inset:-60%;pointer-events:none;background:repeating-conic-gradient(from 0deg at 20% 50%,color-mix(in srgb,var(--fg) 10%,transparent) 0 3deg,transparent 3deg 9deg);animation:spin 90s linear infinite}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;pointer-events:none;background:repeating-linear-gradient(115deg,var(--pink) 0 14px,transparent 14px 28px);opacity:.2;-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.hero>*{position:relative;z-index:1}
.bolt{position:absolute!important;right:26px;top:14px;width:44px;height:64px;background:var(--yellow);clip-path:polygon(55% 0,8% 56%,44% 56%,28% 100%,92% 40%,56% 40%);animation:float 3s ease-in-out infinite}
.mascot{width:118px;height:118px;animation:float 4s ease-in-out infinite}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.bubble{position:relative;background:#fff;color:#16133d;border:3px solid #02040f;border-radius:20px;padding:12px 16px;font-weight:800;max-width:560px;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.bubble::before{content:"";position:absolute;left:-17px;top:26px;border:9px solid transparent;border-right:14px solid #02040f}
.bubble::after{content:"";position:absolute;left:-11px;top:28px;border:7px solid transparent;border-right:11px solid #fff}
.bubble b{font:400 22px/1.15 var(--disp);display:block;margin-bottom:4px}
.hero .actions{margin-top:12px}
.quest{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);border:2px solid var(--ol)}
.quest.done{background:color-mix(in srgb,var(--good) 18%,var(--panel2));border-color:var(--good)}
.quest b{font-weight:800}
.quest .bar{grid-column:2;height:10px}
.xp{font:400 16px var(--sfx);letter-spacing:.05em;background:var(--yellow);color:#241a00;border:2px solid var(--sh);border-radius:8px;padding:2px 7px 1px}
.lvl{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lvl .big{font:400 34px/1 var(--disp);color:var(--acc-t)}

.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 8px;border-radius:16px;border:2.5px solid transparent;font-weight:800;font-size:.92em;text-align:center;line-height:1.2;transition:transform .15s,border-color .15s,background .15s}
.qa button:hover{background:var(--panel2);border-color:var(--ol);transform:translateY(-3px)}
.qa .ico{width:54px;height:54px;border-radius:50%}
.legend{display:flex;gap:16px;color:var(--muted);font-size:.9em;margin-bottom:8px;flex-wrap:wrap;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:2px solid var(--sh)}
.chart{width:100%;height:260px}.chart svg{width:100%;height:260px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutwrap .legend{flex-direction:column;gap:8px;margin:0;flex:1;min-width:150px}

.alert{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);border:2px solid var(--ol);min-width:0}
.alert .ico{width:34px;height:34px;border-radius:11px}
.alert .body{min-width:0;flex:1}
.alert b{display:block;font-weight:800;font-size:.95em}
.alert span{color:var(--muted);font-size:.88em}
.due{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed color-mix(in srgb,var(--ol) 55%,transparent)}
.due:last-child{border:0}
.due .day{width:48px;height:52px;border-radius:12px;background:var(--panel2);border:2px solid var(--ol);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.05}
.due .day b{font:400 19px var(--disp)}.due .day span{font:400 12px var(--sfx);color:var(--muted);letter-spacing:.06em}
.due.hot .day{background:var(--yellow);color:#241a00;border-color:var(--sh)}.due.hot .day span{color:#241a00}
.due .t{min-width:0;flex:1}.due .t b{display:block;font-weight:800}.due .t span{color:var(--muted);font-size:.9em}
.recos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.reco{background:var(--panel2);border:2.5px solid var(--ol);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.reco b{font:400 16px var(--disp)}.reco p{color:var(--muted);flex:1;font-size:.92em}
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.wcard{background:var(--panel);border:2.5px solid var(--ol);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.wcard::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--wc,var(--acc))}
.wcard h3{font:400 15px var(--disp);padding-top:6px}

/* ---------- Adjoint IA ---------- */
.chat{display:flex;flex-direction:column;gap:12px}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:260px;max-height:54vh;overflow-y:auto;padding:4px}
.msg{max-width:min(660px,94%);padding:12px 14px;border-radius:18px;overflow-wrap:anywhere;border:2.5px solid var(--sh);animation:pop .3s both}
.msg.me{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border-color:var(--ol);border-bottom-left-radius:4px}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .btn{margin-top:8px}
.typing i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin:0 2px;animation:float .8s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{padding:8px 12px;border-radius:999px;border:2px solid var(--ol);background:var(--panel2);font-weight:700;font-size:.9em;text-align:left;transition:transform .12s}
.sugg button:hover{border-color:var(--acc);transform:translateY(-2px)}
.askform{display:flex;gap:8px}.askform .inp{flex:1;min-width:0}
.lock{text-align:center;align-items:center}
.lock .mascot{animation:none}

@media (max-width:1100px){.grid-2,.grid-2.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px}
  .bubble::before,.bubble::after{display:none}
  .bubble{text-align:left}
  .hero .actions{justify-content:center}
  .card{padding:16px;border-radius:18px}
  .fgrid{grid-template-columns:1fr}
  .page-head .actions{width:100%}.page-head .actions .btn{flex:1;justify-content:center}
  .toasts{right:16px;left:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));align-items:stretch}
  .toast{max-width:none}
}
.logo .mascot{width:42px;height:42px;animation:none;margin-top:4px}

/* Habillage « fintech » : cartes douces et arrondies, vert profond, trois styles (Frais, Forêt, Néon). */
:root{--disp:"M PLUS Rounded 1c","Nunito","Segoe UI",system-ui,sans-serif}

/* ===== Jetons : mode clair (Frais par défaut) ===== */
:root[data-style][data-mode="light"]{
  color-scheme:light;
  --bg:#eceeed;--bg2:#e3e7e5;--panel:#ffffff;--panel2:#f3f5f4;
  --fg:#11171a;--muted:#6a7378;--ol:#e5e9e7;--sh:rgba(16,32,24,.1);--dot:transparent;
  --soft:0 1px 2px rgba(16,32,24,.04),0 12px 32px -14px rgba(16,32,24,.18);
  --acc:#12874b;--on-acc:#ffffff;--acc-t:#0e6e3d;
  --cyan:#12874b;--pink:#8ccaa7;--violet:#0b5a35;--yellow:#cfe9d9;--lime:#5db381;
  --good:#12874b;--warn:#b97a06;--crit:#d24444;
  --s-bg:#ffffff;--s-fg:#27302c;--s-mut:#7a8480;--s-hover:#f1f4f2;--s-act-bg:#12874b;--s-act-fg:#ffffff}
:root[data-style="forest"][data-mode="light"]{
  --bg:#dfe9e1;--bg2:#d2dfd5;--panel2:#e8f2ea;--ol:#d6e3d9;
  --acc:#1b8f3f;--acc-t:#14702f;--cyan:#1b8f3f;--pink:#8fd0a2;--violet:#0f5e28;--yellow:#cfeadb;--lime:#5cb878;
  --s-bg:#0c1713;--s-fg:#d3e0d8;--s-mut:#7f9488;--s-hover:rgba(255,255,255,.07);--s-act-bg:rgba(255,255,255,.11);--s-act-fg:#ffffff}
:root[data-style="neon"][data-mode="light"]{
  --acc:#2f8a1b;--acc-t:#256f15;--cyan:#2f8a1b;--pink:#a5d46b;--violet:#1f5d12;--yellow:#e2f2bf;--lime:#78b83a;
  --s-bg:#0d0f10;--s-fg:#d8ddda;--s-mut:#80878a;--s-hover:rgba(255,255,255,.07);--s-act-bg:#c4f43a;--s-act-fg:#121c05}

/* ===== Mode sombre ===== */
:root[data-style][data-mode="dark"]{
  color-scheme:dark;
  --bg:#0f1213;--bg2:#171a1c;--panel:#1a1e20;--panel2:#242829;
  --fg:#eef2ef;--muted:#8f989d;--ol:#2b3033;--sh:rgba(0,0,0,.5);--dot:transparent;
  --soft:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -16px rgba(0,0,0,.7);
  --acc:#36c56d;--on-acc:#04200f;--acc-t:#6fe39a;
  --cyan:#36c56d;--pink:#5fae7c;--violet:#2f7d4e;--yellow:#cfe9d9;--lime:#8ad6a6;
  --good:#3fd17a;--warn:#e6b04a;--crit:#f07272;
  --s-bg:#0a0c0d;--s-fg:#ccd3cf;--s-mut:#7d868a;--s-hover:rgba(255,255,255,.07);--s-act-bg:#36c56d;--s-act-fg:#04200f}
:root[data-style="neon"][data-mode="dark"]{
  --acc:#c4f43a;--on-acc:#121c05;--acc-t:#d6f77a;
  --cyan:#c4f43a;--pink:#7cc243;--violet:#3f8a2c;--yellow:#e4fa9f;--lime:#a2d63c;
  --s-act-bg:#c4f43a;--s-act-fg:#121c05}

/* ===== Base ===== */
body{background:var(--bg);font-weight:500}
body::before{display:none}
h1{font:700 clamp(26px,3vw,34px)/1.1 var(--disp);letter-spacing:-.02em;text-shadow:none;margin-top:8px}
.card h2,.sheet h2,.drawer h2,.wcard h3,.reco b{font:700 17px/1.25 var(--disp);letter-spacing:-.01em}
.sheet h2{font-size:21px}.drawer h2{font-size:22px}
.val{font:700 clamp(20px,1.7vw,26px)/1.15 var(--disp);letter-spacing:-.02em}
.due .day b,.lvl .big{font:700 19px var(--disp)}
.chapter{display:inline-flex;transform:none;clip-path:none;box-shadow:none;border:0;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc-t);font:700 12px/1 var(--body);letter-spacing:.06em;padding:6px 11px;border-radius:99px}
.chapter span{font-weight:700;opacity:.75}
.sub{color:var(--muted)}

/* ===== Barre latérale flottante ===== */
.side{background:var(--s-bg);color:var(--s-fg);border:0}
.side::before{display:none}
@media (min-width:901px){
  .side{top:14px;height:calc(100dvh - 28px);margin:14px 0 14px 14px;border-radius:30px;box-shadow:var(--soft)}
}
.brand-name{color:var(--s-fg);font:800 20px/1 var(--disp);letter-spacing:-.02em}
.brand-tag{color:var(--s-mut)}
.logo{background:var(--acc);border:0;box-shadow:none;transform:none;border-radius:16px}
.collapse{color:var(--s-mut);border:0;background:var(--s-hover);border-radius:12px}
.collapse:hover{color:var(--s-fg);background:var(--s-hover)}
.nav-item{color:var(--s-fg);border:0;border-radius:16px}
.nav-item .ni{background:var(--s-hover);border-radius:12px}
.nav-item:hover{background:var(--s-hover);color:var(--s-fg);transform:none}
.nav-item[aria-current="page"]{background:var(--s-act-bg);color:var(--s-act-fg);box-shadow:none;border:0;font-weight:800}
.nav-item[aria-current="page"] .ni{background:rgba(255,255,255,.2);color:inherit}
:root[data-style="neon"] .nav-item[aria-current="page"] .ni{background:rgba(0,0,0,.12)}
:root[data-style="forest"] .nav-item[aria-current="page"] .ni{background:var(--acc);color:#fff}
.badge{font:800 10px/1 var(--body);letter-spacing:.05em;padding:4px 8px;border-radius:99px;border:0;transform:none}
.b-new{background:var(--acc);color:var(--on-acc)}
.b-team{background:var(--s-hover);color:var(--s-fg)}
.b-ia{background:var(--s-hover);color:var(--acc)}
:root[data-style="neon"][data-mode="light"] .b-ia,:root[data-style="neon"][data-mode="dark"] .b-ia{color:#c4f43a}
.nav-item[aria-current="page"] .badge{background:rgba(255,255,255,.22);color:inherit}
:root[data-style="neon"] .nav-item[aria-current="page"] .badge{background:rgba(0,0,0,.14)}
.player{background:var(--s-hover);border:0;border-radius:20px}
.pl-av{background:var(--acc);color:var(--on-acc);border:0;border-radius:50%;font:800 18px var(--disp)}
.pl-name{color:var(--s-fg)}.pl-rank{color:var(--s-mut)}
.pl-xp{background:rgba(127,127,127,.25);border:0}.pl-xp i{background:var(--acc)}

/* ===== Barre du haut ===== */
.top{border:0;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 24px}
.ib,.xpchip{border:0;border-radius:50%;background:var(--panel);box-shadow:var(--soft);transition:transform .15s,box-shadow .15s}
.xpchip{border-radius:99px}
.ib:hover{transform:translateY(-2px);box-shadow:var(--soft);border:0}
.ib:active{transform:scale(.94);box-shadow:var(--soft)}
.searchbox input{border:0;border-radius:99px;background:var(--panel);box-shadow:var(--soft)}
.count{background:var(--acc);color:var(--on-acc);border:2px solid var(--bg);font:800 11px/16px var(--body)}

/* ===== Cartes et tuiles ===== */
.card,.tile,.wcard,.hero{border:0;border-radius:26px;box-shadow:var(--soft);background:var(--panel)}
.card{padding:calc(var(--pad) + 4px)}
.tile{padding:16px 18px;gap:8px}
.tile:hover,.wcard:hover{transform:translateY(-2px)}
.tile .tr{font-weight:700}
.ico{border:0;border-radius:50%;background:color-mix(in srgb,var(--acc) 15%,var(--panel));color:var(--acc-t)}
.ico.v{background:color-mix(in srgb,var(--violet) 16%,var(--panel));color:var(--violet)}
.ico.p{background:color-mix(in srgb,var(--acc) 15%,var(--panel));color:var(--acc-t)}
.ico.w{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.ico.c{background:color-mix(in srgb,var(--crit) 16%,var(--panel));color:var(--crit)}
.ico.g{background:color-mix(in srgb,var(--good) 16%,var(--panel));color:var(--good)}
.cu{color:var(--muted)}
.tile.cash{background:linear-gradient(150deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#000));color:var(--on-acc);position:relative;overflow:hidden}
.tile.cash::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile.cash::after{content:"";position:absolute;right:30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.tile.cash>*{position:relative;z-index:1}
.tile.cash .tr,.tile.cash .delta,.tile.cash .cu{color:inherit;opacity:.88}
.tile.cash .ico{background:rgba(255,255,255,.22);color:inherit}
.tile.cash .val{font-size:clamp(24px,2.1vw,32px)}
:root[data-style="neon"] .tile.cash{background:linear-gradient(150deg,#c4f43a,#8fd22a)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.delta{font-weight:700}

/* bandeau d'accueil */
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello{font:600 clamp(28px,3.6vw,44px)/1.1 var(--disp);letter-spacing:-.03em;margin:0}
.hello span{font-weight:300;color:var(--muted)}
.welcome .sub{margin-top:6px}
.hero,.bolt{display:none}
.logo .mascot{display:block;width:40px;height:40px;margin:0}

/* ===== Boutons ===== */
.btn{height:42px;border:0;border-radius:99px;background:var(--panel);box-shadow:var(--soft);font-weight:700;padding:0 18px;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--soft)}
.btn:active{transform:scale(.97);box-shadow:var(--soft)}
.btn.primary{background:var(--acc);color:var(--on-acc);border:0}
.btn.danger{background:var(--crit);color:#fff;border:0}
.btn.sm{height:34px;padding:0 14px;box-shadow:var(--soft);border-radius:99px}
.btn.ghost{background:transparent;box-shadow:none}
.ra{border:0;border-radius:50%;background:var(--panel2)}
.ra:hover{transform:none}

/* ===== Pastilles, barres, bannières ===== */
.pill{border:0;padding:4px 11px;background:color-mix(in srgb,currentColor 13%,transparent)}
.bar{border:0;height:10px;background:var(--panel2)}
.bar i{animation:none;background:repeating-linear-gradient(135deg,var(--acc) 0 6px,color-mix(in srgb,var(--acc) 80%,#fff) 6px 12px)}
.bar.bad i{background:var(--crit)}
.banner{border:0;border-radius:18px;background:color-mix(in srgb,var(--violet) 10%,var(--panel))}
.banner.crit{background:color-mix(in srgb,var(--crit) 11%,var(--panel))}
.banner.warn{background:color-mix(in srgb,var(--warn) 13%,var(--panel))}
.banner.info{background:color-mix(in srgb,var(--acc) 11%,var(--panel))}
.banner.info svg{color:var(--acc-t)}

/* ===== Tableaux ===== */
th{font:700 12px var(--body);letter-spacing:.03em;border-bottom:1px solid var(--ol)}
td{border-bottom:1px solid var(--ol)}
tbody tr:hover td{background:var(--panel2)}
.in{color:var(--good)}.out{color:var(--crit)}

/* ===== Formulaires ===== */
.inp,.search-in input{border:1.5px solid transparent;border-radius:14px;background:var(--panel2)}
.inp:focus,.search-in input:focus,.searchbox input:focus{outline:0;border-color:var(--acc)}
.chip{border:0;background:var(--panel2);border-radius:99px}
.chip:hover{transform:none;background:color-mix(in srgb,var(--acc) 12%,var(--panel2))}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border:0}
.chk{border:0;background:var(--panel2)}
.ferr{border:0;background:color-mix(in srgb,var(--crit) 13%,var(--panel));color:var(--fg)}
.seg{border:0;background:var(--panel2);border-radius:99px}
.seg button{border-radius:99px}
.sw{border:0;background:color-mix(in srgb,var(--muted) 35%,var(--panel))}
.swatches button{border:0;box-shadow:0 0 0 2px var(--panel2)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)}

/* ===== Fenêtres, tiroir, popovers ===== */
.modal,.dscrim{background:rgba(8,14,11,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{border:0;border-radius:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.pop{border:0;border-radius:20px;box-shadow:0 20px 50px -16px rgba(0,0,0,.4)}
.drawer{border:0;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4);border-radius:28px 0 0 28px}
.set-sec{border:0;border-radius:20px}
.set-sec h3{font:800 11px var(--body);text-transform:uppercase;letter-spacing:.09em}
.quest,.alert,.reco{border:0;border-radius:18px;background:var(--panel2)}
.quest.done{background:color-mix(in srgb,var(--good) 15%,var(--panel2))}
.due{border-bottom:1px solid var(--ol)}
.due .day{border:0;border-radius:14px}
.due.hot .day{background:var(--acc);color:var(--on-acc)}.due.hot .day span{color:var(--on-acc)}
.xp{background:var(--acc);color:var(--on-acc);border:0}
.qa button{border:0}
.msg{border:0}.msg.me{background:var(--acc);color:var(--on-acc)}.msg.ai{background:var(--panel2)}
.sugg button{border:0}
.legend i{border:0;border-radius:50%}

/* ===== Notifications ===== */
.toast{border:0;border-left:4px solid var(--acc);border-radius:16px;box-shadow:0 18px 40px -14px rgba(0,0,0,.35);padding:12px 16px;animation:rise .3s both}
.toast .sfx{display:none}
.toast.k-err{border-left-color:var(--crit)}

/* ===== Graphiques ===== */
.chart rect{stroke:none!important;stroke-width:0!important;rx:9px}
.chart line{opacity:.5}

/* ===== Navigation mobile ===== */
.bottom{border:0;border-radius:26px 26px 0 0;box-shadow:0 -10px 40px -14px rgba(0,0,0,.25)}
.bottom .fab{border:0;box-shadow:var(--soft)}
@media (max-width:900px){.side{border-radius:0 28px 28px 0;margin:0}}
@media (min-width:901px) and (max-height:980px){.nav-item{height:40px}.nav-item .ni{width:28px;height:28px}.nav{gap:2px}}

/* ===== Connexion, profil, boîte mail ===== */
.avt{position:relative;display:inline-grid;place-items:center;width:100%;height:100%;border-radius:inherit;overflow:hidden;background:var(--acc);color:var(--on-acc);font:800 1em var(--disp)}
.avt b{font-weight:800}
.avt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avt.xl{width:104px;height:104px;border-radius:50%;font-size:40px}
.avt.md{width:46px;height:46px;border-radius:50%;font-size:18px;flex:none}
.pl-av{overflow:hidden}
.pl-av .avt{border-radius:50%}
.ib.av{padding:0;overflow:hidden;font-size:16px}
.ib.av .avt{border-radius:50%}
.player{cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{cursor:pointer}
.lnk{background:none;border:0;color:var(--acc-t);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px}
.auth{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:16px;overflow:auto;background:var(--bg)}
.auth[hidden]{display:none}
.auth-wrap{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr);width:min(960px,100%);border-radius:34px;overflow:hidden;background:var(--panel);box-shadow:var(--soft);animation:rise .5s both}
.auth-side{position:relative;padding:40px 34px;color:var(--on-acc);background:linear-gradient(155deg,var(--acc),color-mix(in srgb,var(--acc) 58%,#000));display:flex;flex-direction:column;gap:20px;justify-content:center;overflow:hidden}
.auth-side::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.auth-side::after{content:"";position:absolute;left:-50px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.auth-side>*{position:relative;z-index:1}
.auth-mas .mascot{display:block;width:86px;height:86px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.auth-side h2{font:800 28px/1.15 var(--disp);letter-spacing:-.02em}
.auth-side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-weight:600}
.auth-side li{padding-left:26px;position:relative}
.auth-side li::before{content:"✓";position:absolute;left:0;top:0;font-weight:800}
.auth-card{padding:36px 38px;display:flex;flex-direction:column;gap:14px;min-width:0}
.auth-brand{display:flex;align-items:baseline;gap:10px}
.auth-brand b{font:800 20px var(--disp)}.auth-brand span{color:var(--muted);font-size:.9em}
.auth-card h1{margin:4px 0 0;font-size:30px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-tabs{align-self:flex-start}
.auth-claude{width:100%;justify-content:center;height:46px}
.auth-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85em}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--ol)}
.auth-go{height:48px;justify-content:center;margin-top:4px}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pw{position:relative;display:flex}
.pw .inp{padding-right:48px}
.pw .ra{position:absolute;right:6px;top:4px}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof-av{width:104px;height:104px;flex:none}
.prof-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:200px}
.prof-btns .hint{flex-basis:100%}
.mlrow{display:flex;align-items:center;gap:12px;min-width:0}
.mlrow>div{min-width:0}.mlrow b{display:block;overflow:hidden;text-overflow:ellipsis}
.mlrow small{display:flex;gap:8px;align-items:center;color:var(--muted)}
.sheet.prof-sheet{width:min(640px,100%)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-acc)}
@media (max-width:760px){
  .auth{place-items:start center}
  .auth-wrap{grid-template-columns:1fr;border-radius:26px}
  .auth-side{display:none}
  .auth-card{padding:26px 22px}
}
.set-sec .inp,.set-sec select.inp{background:var(--panel);border-color:var(--ol)}

/* ===== Dossiers, Mobile Money, premiers pas ===== */
.wschip{display:inline-flex;align-items:center;gap:8px;height:42px;max-width:220px;padding:0 16px;border-radius:99px;background:var(--panel);box-shadow:var(--soft);font-weight:700;flex:none;transition:transform .15s}
.wschip:hover{transform:translateY(-1px)}
.wschip svg{color:var(--acc-t)}
.wschip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline}
.wcard.idle{background:transparent;box-shadow:none;border:1.5px dashed var(--ol)}
.wcard.idle::before{opacity:.5}
.wcard .actions{margin-top:4px}
.wsrow{border-radius:18px;background:var(--panel2);padding:10px 12px}
.wsrow .rowact{margin-left:auto;align-items:center}
.mlrow{display:flex;align-items:center;gap:12px;min-width:0}
.mlrow>div:not(.rowact){min-width:0}
.mlrow small{display:block;color:var(--muted)}
.fs-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel2);font-weight:700;transition:transform .15s,background .15s}
.fs-row:hover:not(:disabled){transform:translateX(3px);background:color-mix(in srgb,var(--acc) 12%,var(--panel2))}
.fs-row.done{opacity:.6;text-decoration:line-through}
.fs-row.done .ico{background:var(--good);color:#fff}
@media (max-width:700px){.wschip{width:42px;padding:0;justify-content:center}.wschip span{display:none}}

/* ComptaPro – couche finale : police Inter, style « Pro » (palette stricte), logo, connexion, tiroirs, densité, grille 8 px */
:root{--disp:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sfx:Inter,system-ui,sans-serif;--rh:40px;--r:12px}
html,body,button,input,select,textarea{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{font-feature-settings:"cv11","ss01";letter-spacing:-.003em}
.val,td.num,.money,[data-n],.mono,.tot{font-variant-numeric:tabular-nums}
h1,.card h2,.sheet h2,.drawer h2,.val{font-family:Inter,system-ui,sans-serif}
.mascot{display:none}
.chapter{display:none}

/* ===== Style Pro : 5 couleurs strictes ===== */
:root[data-style="pro"][data-mode="light"]{
 color-scheme:light;--bg:#F8FAFC;--bg2:#F1F5F9;--panel:#FFFFFF;--panel2:#F1F5F9;--fg:#0F172A;--muted:#64748B;--ol:#E2E8F0;--sh:rgba(15,23,42,.08);
 --soft:0 1px 2px rgba(15,23,42,.05);--acc:#2563EB;--on-acc:#FFFFFF;--acc-t:#1D4ED8;
 --cyan:#2563EB;--pink:#94A3B8;--violet:#1E3A8A;--yellow:#CBD5E1;--lime:#16A34A;
 --good:#16A34A;--warn:#475569;--crit:#DC2626;
 --s-bg:#FFFFFF;--s-fg:#0F172A;--s-mut:#64748B;--s-hover:#F1F5F9;--s-act-bg:#EFF6FF;--s-act-fg:#1D4ED8}
:root[data-style="pro"][data-mode="dark"]{
 color-scheme:dark;--bg:#0B1220;--bg2:#0F172A;--panel:#111B2F;--panel2:#18243B;--fg:#E2E8F0;--muted:#94A3B8;--ol:#1F2C45;--sh:rgba(0,0,0,.5);
 --soft:0 1px 2px rgba(0,0,0,.35);--acc:#3B82F6;--on-acc:#FFFFFF;--acc-t:#93C5FD;
 --cyan:#3B82F6;--pink:#64748B;--violet:#60A5FA;--yellow:#475569;--lime:#22C55E;
 --good:#22C55E;--warn:#94A3B8;--crit:#F87171;
 --s-bg:#0F1A2E;--s-fg:#E2E8F0;--s-mut:#94A3B8;--s-hover:rgba(255,255,255,.06);--s-act-bg:rgba(59,130,246,.18);--s-act-fg:#BFDBFE}
:root[data-style="pro"] body{font-weight:400}
:root[data-style="pro"] .card,:root[data-style="pro"] .tile,:root[data-style="pro"] .wcard,:root[data-style="pro"] .hero{border:1px solid var(--ol);border-radius:var(--r);box-shadow:var(--soft)}
:root[data-style="pro"] .tile.cash{background:var(--panel);color:var(--fg)}
:root[data-style="pro"] .tile.cash::before,:root[data-style="pro"] .tile.cash::after{display:none}
:root[data-style="pro"] .tile.cash .tr,:root[data-style="pro"] .tile.cash .delta,:root[data-style="pro"] .tile.cash .cu{color:var(--muted)}
:root[data-style="pro"] .tile.cash .ico{background:var(--panel2);color:var(--acc)}
:root[data-style="pro"] .btn,:root[data-style="pro"] .btn.sm{border-radius:10px;box-shadow:none;border:1px solid var(--ol);font-weight:600}
:root[data-style="pro"] .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
:root[data-style="pro"] .btn.danger{background:var(--crit);border-color:var(--crit)}
:root[data-style="pro"] .btn.ghost{border-color:transparent;background:transparent}
:root[data-style="pro"] .btn:hover{transform:none;background:var(--panel2)}
:root[data-style="pro"] .btn.primary:hover{background:var(--acc-t);border-color:var(--acc-t)}
:root[data-style="pro"] .ib{border:1px solid var(--ol);border-radius:10px;box-shadow:none}
:root[data-style="pro"] .ib:hover{transform:none;background:var(--panel2)}
:root[data-style="pro"] .top{background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--ol)}
:root[data-style="pro"] .side{border-right:1px solid var(--ol)}
@media (min-width:901px){:root[data-style="pro"] .side{top:0;height:100dvh;margin:0;border-radius:0;box-shadow:none}}
:root[data-style="pro"] .nav-item{border-radius:10px}
:root[data-style="pro"] .inp,:root[data-style="pro"] select.inp,:root[data-style="pro"] textarea.inp{border:1px solid var(--ol);border-radius:10px;background:var(--panel)}
:root[data-style="pro"] .inp:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);border-color:var(--acc)}
:root[data-style="pro"] .sheet{border:0;border-radius:0;box-shadow:-12px 0 40px -16px rgba(15,23,42,.25)}
:root[data-style="pro"] .pill{border-radius:99px}
:root[data-style="pro"] .seg{border-radius:10px}
:root[data-style="pro"] .seg button{border-radius:8px}

/* ===== Logo ComptaPro : fait partie de l'interface ===== */
.lgm{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--on-acc);border:0;box-shadow:none;transform:none;overflow:hidden}
.logo .lgm{width:26px;height:26px}
.brand-name{letter-spacing:-.02em}
.lock .lgm{font-size:56px;color:var(--acc)}
.partner{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--ol)}
.partner img{display:block;height:44px;width:auto;max-width:100%}
.partner.gm{width:40px;height:40px;padding:6px;border-radius:50%}.partner.gm img{height:26px}
.org{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.org h3{margin:0;font-size:16px;font-weight:700}.org small{color:var(--muted);display:block}

/* ===== Avatar : rond, plein, sans bordure ===== */
.ib.av,.pl-av{border:0!important;box-shadow:none!important;outline:0;background:transparent;padding:0;border-radius:50%;overflow:hidden}
.ib.av{width:40px;height:40px}
.pl-av{width:40px;height:40px;background:var(--acc)}

<script>
(function(){
"use strict";
var d=document;
var CP=window.CP={V:{},ACT:{},AFTER:{},T:{},U:{view:'dashboard',chart:'month',reveal:false},hook:{}};
CP.$=function(s,r){return (r||d).querySelector(s)};
CP.$$=function(s,r){return Array.prototype.slice.call((r||d).querySelectorAll(s))};
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
CP.esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC[c]})};
CP.uid=function(){return Math.random().toString(36).slice(2,8)};

/* ---------- Dates ---------- */
function iso(x){return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)}
CP.today=function(){return iso(new Date())};
CP.ago=function(n){var x=new Date();x.setDate(x.getDate()-n);return iso(x)};
CP.ahead=function(n){return CP.ago(-n)};
CP.dfmt=function(s){return CP.perso?CP.perso.date(s):s};
CP.diff=function(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)};
CP.within=function(s,n){var k=CP.diff(s,CP.today());return k>=0&&k<=n};
CP.nextDay=function(day){var x=new Date(),m=x.getMonth();if(x.getDate()>day)m++;return iso(new Date(x.getFullYear(),m,day))};
CP.endMonth=function(){var x=new Date();return iso(new Date(x.getFullYear(),x.getMonth()+1,0))};

/* ---------- État, sauvegarde, réglages ---------- */
/* Un espace de travail (dossier) par compte : clé de stockage propre, vide ou avec données d'exemple. Sans compte (mode découverte) : démo non enregistrée. */
CP.wsKeyOf=function(w){return 'comptapro-ws-'+w.id};
CP.load=function(){
 var w=CP.U.ws,demo=!w||w.demo,def=demo?CP.DEF():CP.EMPTY(),s=null;
 if(w){try{s=JSON.parse(localStorage.getItem(CP.wsKeyOf(w)))}catch(e){}}
 if(s&&typeof s==='object'&&s.v===2){for(var k in def){if(!(k in s))s[k]=def[k]}s.settings=Object.assign({},def.settings,s.settings);s.company=Object.assign({},def.company,s.company);CP.S=s}
 else{CP.S=def;if(CP.U.seed){CP.S.settings=Object.assign({},def.settings,CP.U.seed.settings||{});if(CP.U.seed.company)CP.S.company=Object.assign({},def.company,CP.U.seed.company);if(CP.U.seed.vatRate!=null)CP.S.vatRate=CP.U.seed.vatRate;CP.U.seed=null}}
 CP.S.v=2;dayCheck();
};
var st;
CP.save=function(){clearTimeout(st);if(!CP.U.ws)return;var w=CP.U.ws;if(CP.syncState)CP.syncState('saving');st=setTimeout(function(){try{localStorage.setItem(CP.wsKeyOf(w),JSON.stringify(CP.S));if(CP.syncState)CP.syncState('saved')}catch(e){CP.toast(CP.t('Impossible d’enregistrer sur cet appareil.'),'err')}},250)};
CP.flush=function(){clearTimeout(st);if(!CP.U.ws)return;try{localStorage.setItem(CP.wsKeyOf(CP.U.ws),JSON.stringify(CP.S))}catch(e){}};
CP.reset=function(mode){var keep=CP.S.settings,co=CP.S.company,me=CP.S.members&&CP.S.members[0];CP.S=(mode==='demo'?CP.DEF():CP.EMPTY());CP.S.v=2;CP.S.settings=keep;CP.S.company=Object.assign({},CP.S.company,co);if(mode!=='demo'&&me){CP.S.members[0].name=me.name;CP.S.members[0].email=me.email}CP.flush();CP.save()};
CP.apply=function(){
 var r=d.documentElement,s=CP.S.settings;
 if(s.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',s.theme);
 var lm=s.theme==='light'||(s.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);r.setAttribute('data-mode',lm?'light':'dark');r.setAttribute('data-accent',s.accent);r.setAttribute('data-style',s.style||'pro');r.setAttribute('data-rows',CP.rowsMode?CP.rowsMode():'comfort');if(CP.perso)CP.perso.apply();r.setAttribute('data-fx',s.fx?'on':'off');
 r.setAttribute('data-compact',s.compact?'on':'off');r.setAttribute('data-fs',s.fs);r.lang=s.lang;
};
CP.log=function(txt){var a=CP.S.audit;a.unshift({t:Date.now(),w:CP.S.settings.name,x:txt});if(a.length>40)a.length=40};

/* ---------- Langue et devise ---------- */
CP.t=function(s){if(CP.S&&CP.S.settings.lang==='en'&&CP.EN&&CP.EN[s]!=null)return CP.EN[s];return s};
CP.tf=function(s){var a=arguments;return CP.t(s).replace(/\{(\d)\}/g,function(m,i){return a[+i+1]})};
var RATE={XOF:1,EUR:1/655.957,USD:1/600};
CP.RATE=RATE;
CP.cur=function(){return CP.S.settings.currency};
CP.loc=function(){return CP.S.settings.lang==='en'?'en-US':'fr-FR'};
CP.num=function(n,dec){return Math.abs(n).toLocaleString(CP.perso?CP.perso.numLoc():CP.loc(),{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}).replace(/[  ]/g,' ')};
CP.money=function(n){
 var c=CP.cur(),v=n*RATE[c],s=CP.num(v,c==='XOF'?0:2),neg=Math.round(v*100)<0?'−':'';
 if(c==='XOF')return neg+s+' FCFA';
 if(c==='EUR')return neg+s+' €';
 return neg+(CP.S.settings.lang==='en'?'$'+s:s+' $');
};
CP.moneyHtml=function(n){
 var s=CP.money(n),i=s.lastIndexOf(' ');
 if(i>0&&/^(FCFA|€|\$)$/.test(s.slice(i+1)))return CP.esc(s.slice(0,i))+' <span class="cu">'+s.slice(i+1)+'</span>';
 return CP.esc(s);
};
CP.compact=function(n){return new Intl.NumberFormat(CP.loc(),{notation:'compact',maximumFractionDigits:1}).format(n*RATE[CP.cur()])};
CP.toXOF=function(v){return Math.round(v/RATE[CP.cur()])};
CP.fromXOF=function(n){var v=n*RATE[CP.cur()];return CP.cur()==='XOF'?Math.round(v):Math.round(v*100)/100};
CP.curLabel=function(){return {XOF:'FCFA',EUR:'€',USD:'$'}[CP.cur()]};

/* ---------- Missions, XP, niveaux ---------- */
CP.QUESTS=[
 {id:'inv',k:'inv',t:'Crée une facture',goal:1,xp:30},
 {id:'ent',k:'ent',t:'Valide 2 écritures',goal:2,xp:25},
 {id:'bank',k:'bank',t:'Rapproche 2 opérations bancaires',goal:2,xp:25},
 {id:'cli',k:'cli',t:'Ajoute un client',goal:1,xp:20},
 {id:'ai',k:'ai',t:'Pose une question à l’Adjoint IA',goal:1,xp:15}
];
function dayCheck(){var s=CP.S,t=CP.today();if(s.day!==t){s.day=t;s.q={}}}
CP.level=function(){return Math.floor(CP.S.xp.total/100)+1};
CP.rank=function(l){
 var R=[[12,'Légende'],[8,'Sensei ComptaPro'],[5,'Samouraï du budget'],[3,'Ninja des chiffres'],[2,'Apprenti·e']];
 for(var i=0;i<R.length;i++)if(l>=R[i][0])return CP.t(R[i][1]);
 return CP.t('Recrue');
};
CP.gain=function(n){
 var s=CP.S;if(!s.settings.game)return;
 var l0=CP.level();s.xp.total+=n;var l1=CP.level();
 if(l1>l0){CP.toast(CP.tf('Niveau {0} atteint : {1} !',l1,CP.rank(l1)),'win');CP.sfx('level');CP.burst()}
 if(CP.hook.player)CP.hook.player();
};
CP.track=function(k){
 var s=CP.S;if(!s.settings.game)return;
 dayCheck();var t=CP.today();
 if(s.xp.last!==t){s.xp.streak=(s.xp.last&&CP.diff(s.xp.last,t)===1)?s.xp.streak+1:1;s.xp.last=t}
 CP.QUESTS.forEach(function(q){
  if(q.k!==k)return;
  var n=s.q[q.id]||0;if(n>=q.goal)return;
  s.q[q.id]=++n;
  if(n>=q.goal){CP.toast(CP.t('Mission accomplie : ')+CP.t(q.t)+' · +'+q.xp+' XP','win');CP.burst();CP.gain(q.xp)}
 });
 CP.gain(5);
};

/* ---------- Sons ---------- */
var ac;
function tone(f,t,dur,type){
 var o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+t;
 o.type=type||'square';o.frequency.value=f;
 g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.05,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+dur);
 o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+dur+.02);
}
var SF={click:[[660,0,.06]],ok:[[523,0,.08],[784,.08,.12]],win:[[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.18]],err:[[196,0,.14,'sawtooth'],[147,.12,.18,'sawtooth']],level:[[392,0,.1],[523,.1,.1],[659,.2,.1],[784,.3,.1],[1047,.4,.25]]};
CP.sfx=function(n){
 if(!CP.S||!CP.S.settings.sound)return;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();(SF[n]||[]).forEach(function(a){tone(a[0],a[1],a[2],a[3])})}catch(e){}
};

/* ---------- Notifications « onomatopées » ---------- */
var WORD={ok:'ZAP!',win:'BOOM!',err:'OUPS!',info:'INFO'};
CP.toast=function(msg,kind){
 kind=kind||'ok';
 var box=CP.$('#toasts');if(!box)return;
 while(box.children.length>=3)box.removeChild(box.firstChild);
 var el=d.createElement('div');
 el.className='toast k-'+kind;
 el.innerHTML='<span class="sfx">'+CP.esc(CP.t(WORD[kind]||'ZAP!'))+'</span><span>'+CP.esc(msg)+'</span>';
 box.appendChild(el);
 CP.sfx(kind==='err'?'err':(kind==='win'?'win':'ok'));
 setTimeout(function(){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},320)},kind==='win'?4600:3600);
};

/* ---------- Confettis ---------- */
var ps=[],raf=0;
CP.burst=function(x,y){
 if(!CP.S.settings.fx||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
 var c=CP.$('#fx');if(!c)return;
 var w=c.width=innerWidth,h=c.height=innerHeight;
 x=x==null?w/2:x;y=y==null?h*.3:y;
 var cols=['#ff4fa3','#22d3ee','#ffd43b','#c6f432','#8b6bff'];
 for(var i=0;i<46;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*7;ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:4+Math.random()*5,c:cols[i%5],l:60+Math.random()*30,rot:Math.random()*6,s:Math.random()>.5})}
 if(!raf)loop();
};
function loop(){
 var c=CP.$('#fx'),g=c.getContext('2d');
 g.clearRect(0,0,c.width,c.height);
 ps=ps.filter(function(p){
  p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.985;p.l--;p.rot+=.2;
  g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.globalAlpha=Math.min(1,p.l/20);g.fillStyle=p.c;
  if(p.s)g.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{g.beginPath();g.arc(0,0,p.r/1.6,0,7);g.fill()}
  g.restore();return p.l>0;
 });
 if(ps.length)raf=requestAnimationFrame(loop);else{raf=0;g.clearRect(0,0,c.width,c.height)}

/* ---------- Calculs partagés ---------- */
CP.sum=function(arr,fn){return arr.reduce(function(s,x){return s+fn(x)},0)};
CP.invSt=function(i){if(i.type==='quote')return'quote';if(i.st==='paid')return'paid';return i.due<CP.today()?'late':'pending'};
CP.entSt=function(e){return e.d!==e.c?'unbalanced':e.st};
CP.prodDone=function(o){var k=[0,.4,.8,1][o.step];return o.step===3?Math.round(o.plan*(1-o.loss/100)):Math.round(o.plan*k)};
CP.net=function(e){return e.gross+e.bonus-e.ded};
CP.margin=function(p){return Math.round((p.price-p.cost)/p.price*100)};
CP.kpi=function(){
 var S=CP.S,sum=CP.sum;
 var inv=S.inv.filter(function(i){return i.type!=='quote'&&CP.within(i.date,30)});
 var rev=sum(inv,function(i){return i.amount});
 var ex=sum(S.exps.filter(function(e){return(e.st==='approved'||e.st==='paid')&&CP.within(e.date,30)}),function(e){return e.amt});
 var exp=S.baseExp+ex;
 var pend=S.inv.filter(function(i){return CP.invSt(i)==='pending'}),late=S.inv.filter(function(i){return CP.invSt(i)==='late'});
 return{rev:rev,exp:exp,profit:rev-exp,approved:ex,
  treas:sum(S.wallets.filter(function(w){return w.type==='pro'}),function(w){return w.bal}),
  pend:sum(pend,function(i){return i.amount}),nPend:pend.length,late:sum(late,function(i){return i.amount}),nLate:late.length};
};
CP.vat=function(){
 var k=CP.kpi(),r=CP.S.vatRate;
 var col=Math.round(k.rev*r/(100+r)),ded=Math.round((CP.S.baseExp*.45+k.approved)*r/(100+r));
 return{rate:r,collected:col,deductible:ded,due:Math.max(0,col-ded),next:CP.nextDay(15)};
};
CP.cli=function(c){
 var inv=CP.S.inv.filter(function(i){return i.client===c.name&&i.type!=='quote'}),ca=c.hist+CP.sum(inv,function(i){return i.amount});
 return{ca:ca,unpaid:CP.sum(inv.filter(function(i){return i.st!=='paid'}),function(i){return i.amount}),rank:ca>=8e6?'A':(ca>=3e6?'B':'C')};
};
CP.catData=function(){
 var b=CP.S.baseExp,m={'Salaires':b*.52,'Loyer et charges':b*.23,'Marketing':b*.12,'Autres charges':b*.13};
 CP.S.exps.forEach(function(e){if((e.st==='approved'||e.st==='paid')&&CP.within(e.date,30))m[e.cat]=(m[e.cat]||0)+e.amt});
 return Object.keys(m).map(function(k){return{l:k,v:Math.round(m[k])}}).sort(function(x,y){return y.v-x.v});
};
var HR=[11.2,12.8,10.9,13.4,14.1,13.0,15.2,16.0,14.7,15.9,16.4],HE=[7.1,8.4,7.9,8.2,8.8,8.1,9.0,9.6,8.7,9.3,8.9];
CP.series=function(mode){
 var k=CP.kpi(),x=new Date(),L=[],R=[],E=[],i;
 if(mode==='year'){
  var y=x.getFullYear();
  for(i=4;i>=0;i--)L.push(String(y-i));
  var cr=CP.sum(HR,function(v){return v})*1e6+k.rev,ce=CP.sum(HE,function(v){return v})*1e6+k.exp;
  return{labels:L,rev:[78.4e6,102.6e6,131.9e6,158.3e6,cr],exp:[51.2e6,64.8e6,80.1e6,94.7e6,ce]};
 }
 for(i=11;i>=0;i--){var m=new Date(x.getFullYear(),x.getMonth()-i,1);L.push(m.toLocaleDateString(CP.loc(),{month:'short'}).replace('.',''))}
 R=HR.map(function(v){return v*1e6});E=HE.map(function(v){return v*1e6});R.push(k.rev);E.push(k.exp);
 return{labels:L,rev:R,exp:E};
};
CP.alerts=function(){
 var S=CP.S,out=[],tf=CP.tf;
 S.inv.filter(function(i){return CP.invSt(i)==='late'}).sort(function(x,y){return x.due<y.due?-1:1}).forEach(function(i){
  out.push({key:'late-'+i.id,tone:'c',ic:'alert',t:tf('Facture {0} impayée depuis {1} jours',i.id,CP.diff(i.due,CP.today())),s:i.client+' · '+CP.money(i.amount),go:'sales',btn:'Relancer',act:'sales.remind',id:i.id});
 });
 var ub=S.entries.filter(function(e){return CP.entSt(e)==='unbalanced'});
 ub.forEach(function(e){out.push({key:'ub-'+e.id,tone:'c',ic:'alert',t:tf('Écriture {0} déséquilibrée',e.id),s:tf('Débit {0}, crédit {1}',CP.money(e.d),CP.money(e.c)),go:'compta',btn:'Corriger',act:'compta.fix',id:e.id})});
 var v=S.decl.filter(function(x){return x.live})[0],dd=v?CP.diff(CP.today(),v.due):99;
 if(v&&v.st!=='filed'&&v.st!=='archived'&&dd<=14)out.push({key:'vat-'+v.due,tone:'w',ic:'cal',t:tf('TVA de {0} à déposer',v.period),s:tf('Avant le {0}, dans {1} jours',CP.dfmt(v.due),Math.max(dd,0)),go:'tax',btn:'Préparer'});
 var low=S.products.filter(function(p){return p.stock<p.min}).length;
 if(low)out.push({key:'low-'+low,tone:'w',ic:'box',t:tf('{0} produits sous le seuil de stock',low),s:CP.t('Pense à passer commande'),go:'stock',btn:'Voir'});
 var ne=S.exps.filter(function(e){return e.st==='sent'}).length;
 if(ne)out.push({key:'exp-'+ne,tone:'v',ic:'scan',t:tf('{0} notes de frais à valider',ne),s:CP.t('Les employés attendent ta réponse'),go:'expenses',btn:'Valider'});
 var nl=S.leaves.filter(function(l){return l.st==='pending'}).length;
 if(nl)out.push({key:'lv-'+nl,tone:'v',ic:'briefcase',t:tf('{0} demandes de congé en attente',nl),s:CP.t('À accepter ou refuser'),go:'hr',btn:'Voir'});
 var nd=S.bank.filter(function(b){return b.st==='dup'}).length;
 if(nd)out.push({key:'dup-'+nd,tone:'w',ic:'bank',t:tf('{0} doublon possible en banque',nd),s:CP.t('Vérifie les mouvements en double'),go:'banks',btn:'Voir'});
 return out;
};

function cellVal(r,c){return c.v?c.v(r):r[c.k]}

CP.table=function(id,o){

 var h='<div class="tbl" data-tid="'+id+'"><div class="tb-bar">';
 if(o.search!==false)h+='<label class="search-in">'+ic('search',16)+'<input type="search" data-tsearch="'+id+'" placeholder="'+esc(t('Rechercher…'))+'" aria-label="'+esc(t('Rechercher…'))+'" value="'+esc(T.q)+'"></label>';
 if(o.chips)h+='<div class="chips" data-chips="'+id+'">'+chipsHtml(id)+'</div>';

};
CP.tbody=function(id){
 var T=CP.T[id],o=T.o,rows=o.rows();
 if(o.chips&&T.f&&T.f!=='all'&&o.chip)rows=rows.filter(function(r){return o.chip(r,T.f)});
 var q=T.q.trim().toLowerCase();
 if(q)rows=rows.filter(function(r){return o.cols.some(function(c){var v=cellVal(r,c);return String(v==null?'':v).toLowerCase().indexOf(q)>-1})});
 var sc=o.cols.filter(function(c){return c.k===T.s})[0];
 if(sc)rows=rows.slice().sort(function(a,b){var x=cellVal(a,sc),y=cellVal(b,sc);if(typeof x==='string')return x.localeCompare(y)*T.d;return(x<y?-1:x>y?1:0)*T.d});
 var key=q+'|'+T.f+'|'+T.s+'|'+T.d;if(T.key!==key){T.key=key;T.n=100}
 var total=rows.length;if(total>(T.n||100))rows=rows.slice(0,T.n||100);
 var h='<div class="tablewrap"><table><thead><tr>';
 o.cols.forEach(function(c){
  var num=c.t==='money'||c.t==='num'||c.t==='pct',on=T.s===c.k;
  h+='<th class="'+(num?'num':'')+'"'+(c.s===false?'':' data-tsort="'+id+':'+c.k+'" aria-sort="'+(on?(T.d>0?'ascending':'descending'):'none')+'"')+'>'+esc(t(c.l))+(on?(T.d>0?' ▲':' ▼'):'')+'</th>';
 });
 if(o.act)h+='<th></th>';
 h+='</tr></thead><tbody>';
 rows.forEach(function(r){
  h+='<tr>';
  o.cols.forEach(function(c){
   var v=cellVal(r,c),s;
   if(c.f)s=c.f(r);else if(c.t==='money')s=CP.money(v);else if(c.t==='num')s=CP.num(v);else if(c.t==='date')s=CP.dfmt(v);else if(c.t==='pct')s=v+' %';else s=esc(v);
   h+='<td class="'+(c.t==='money'||c.t==='num'||c.t==='pct'?'num':'')+'">'+s+'</td>';
  });
  if(o.act)h+='<td><div class="rowact">'+o.act(r).map(function(a){return '<button class="ra'+(a[3]?' bad':'')+'" data-act="'+a[0]+'" data-id="'+esc(r.id)+'" title="'+esc(t(a[2]))+'" aria-label="'+esc(t(a[2]))+'">'+ic(a[1],16)+'</button>'}).join('')+'</div></td>';
  h+='</tr>';
 });
 h+='</tbody></table></div>';
 if(!rows.length)h+='<div class="empty">'+esc(t(o.empty||'Aucun résultat pour ces filtres.'))+'</div>';
 else if(total>rows.length)h+='<div class="hint tmore" style="margin-top:8px">'+esc(CP.tf('{0} affichés sur {1}',rows.length,total))+' <button class="btn sm" data-act="tbl.more" data-id="'+esc(id)+'">'+esc(t('Afficher plus'))+'</button></div>';
 else h+='<div class="hint" style="margin-top:8px">'+esc(CP.tf('{0} résultat(s)',rows.length))+'</div>';
 return h;
};

function fieldHtml(f){
 var id='f_'+f.k,lab=t(f.l)+(f.t==='money'?' ('+CP.curLabel()+')':'')+(f.req?' *':''),c='';
 var v=f.v==null?'':f.v;
 if(f.t==='select')c='<select class="inp" id="'+id+'" name="'+f.k+'">'+CP.opts(f.o,v)+'</select>';
 else if(f.t==='textarea')c='<textarea class="inp" id="'+id+'" name="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
 else if(f.t==='checks')c='<div class="checks" id="'+id+'">'+f.o.map(function(o){return '<label class="chk"><input type="checkbox" name="'+f.k+'" value="'+esc(o[0])+'"'+((v||[]).indexOf(o[0])>-1?' checked':'')+'>'+esc(o[1])+'</label>'}).join('')+'</div>';
 else{
  var ty=f.t==='money'||f.t==='number'?'number':(f.t||'text');
  if(f.t==='money'&&v!=='')v=CP.fromXOF(v);
  c='<input class="inp" id="'+id+'" name="'+f.k+'" type="'+ty+'"'+(ty==='number'?' step="any" inputmode="decimal"':'')+' value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+(f.max!=null?' max="'+f.max+'"':'')+' autocomplete="off">';
 }
 return '<div class="field'+(f.w?' wide':'')+'"><label for="'+id+'">'+esc(lab)+'</label>'+c+(f.h?'<span class="fh">'+esc(t(f.h))+'</span>':'')+'</div>';
}
CP.form=function(o){

CP.formErr=function(msg){var e=CP.$('#cpForm .ferr');if(e){e.textContent=msg;e.hidden=false;e.style.animation='none';void e.offsetWidth;e.style.animation=''}};
CP.submitForm=function(){
 var o=CP._f,fm=CP.$('#cpForm');if(!o||!fm)return;
 var v={},i,f,el;
 for(i=0;i<o.fields.length;i++){
  f=o.fields[i];
  if(f.t==='checks'){v[f.k]=CP.$$('input[name="'+f.k+'"]:checked',fm).map(function(x){return x.value});continue}
  el=fm.elements[f.k];var raw=String(el.value).trim();
  if(f.req&&!raw)return CP.formErr(CP.tf('Remplis le champ « {0} ».',t(f.l)));
  if(f.t==='number'||f.t==='money'){
   if(raw===''){v[f.k]=null;continue}
   var n=parseFloat(raw.replace(',','.'));
   if(isNaN(n))return CP.formErr(CP.tf('« {0} » doit être un nombre.',t(f.l)));
   if(f.min!=null&&n<f.min)return CP.formErr(CP.tf('« {0} » doit être supérieur à {1}.',t(f.l),f.min));
   if(f.max!=null&&n>f.max)return CP.formErr(CP.tf('« {0} » ne peut pas dépasser {1}.',t(f.l),f.max));
   v[f.k]=f.t==='money'?CP.toXOF(n):n;
  }else if(f.t==='email'){
   if(raw&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw))return CP.formErr(t('Cette adresse e-mail n’est pas valide.'));
   v[f.k]=raw;
  }else v[f.k]=raw;
 }
 var err=o.fn(v);
 if(err)return CP.formErr(err);
 CP.closeModal();
};

/* ---------- Graphiques ---------- */
function nice(mx){
 var e=Math.pow(10,Math.floor(Math.log10(mx||1))),m=mx/e,s=m<=1.5?.25:(m<=3?.5:(m<=7?1:2));
 var step=s*e,top=Math.ceil(mx/step)*step;
 return{top:top,step:step};
}
CP.barChart=function(el,labels,series){
 var w=Math.max(280,el.clientWidth),h=260,L=52,R=6,T=10,B=28,n=labels.length,rate=CP.RATE[CP.cur()];
 var mx=0;series.forEach(function(s){s.v.forEach(function(x){if(x*rate>mx)mx=x*rate})});
 var sc=nice(mx),gw=(w-L-R)/n,bw=Math.min(26,gw*.36),k;
 function Y(v){return T+(h-T-B)*(1-v/sc.top)}
 var s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(t('Revenus et dépenses'))+'">';
 for(k=0;k<=sc.top+1e-9;k+=sc.step){
  s+='<line x1="'+L+'" x2="'+(w-R)+'" y1="'+Y(k)+'" y2="'+Y(k)+'" style="stroke:var(--ol)" stroke-width="1.5" stroke-dasharray="'+(k?'3 5':'0')+'" opacity=".6"/>';
  s+='<text x="'+(L-8)+'" y="'+(Y(k)+4)+'" text-anchor="end" font-size="11" font-weight="700" style="fill:var(--muted)">'+new Intl.NumberFormat(CP.loc(),{notation:'compact',maximumFractionDigits:1}).format(k)+'</text>';
 }
 labels.forEach(function(lb,i){
  var cx=L+gw*i+gw/2,last=i===n-1;
  series.forEach(function(se,j){
   var v=se.v[i]*rate,x=cx+(j?2:-bw-2),y=Y(v);
   s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(0,h-B-y)+'" rx="5" style="fill:'+se.c+';stroke:var(--sh)" stroke-width="2.5" opacity="'+(last?1:.82)+'"><title>'+esc(lb+' · '+se.n+' : '+CP.money(se.v[i]))+'</title></rect>';
  });
  s+='<text x="'+cx+'" y="'+(h-8)+'" text-anchor="middle" font-size="11" font-weight="'+(last?800:600)+'" style="fill:'+(last?'var(--fg)':'var(--muted)')+'">'+esc(gw<30?lb.charAt(0).toUpperCase():lb)+'</text>';
 });
 el.innerHTML=s+'</svg>';
};
CP.PAL=['var(--fg)','var(--pink)','var(--violet)','var(--yellow)','var(--lime)','var(--muted)'];
CP.donut=function(items,size){
 var tot=CP.sum(items,function(i){return i.v})||1,r=size/2-14,C=2*Math.PI*r,off=0;
 var s='<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="'+esc(t('Dépenses par catégorie'))+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" style="stroke:var(--panel2)" stroke-width="22"/>';
 items.forEach(function(it,i){
  var len=it.v/tot*C;
  s+='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+CP.PAL[i%6]+'" stroke-width="22" stroke-dasharray="'+Math.max(0,len-3)+' '+(C-Math.max(0,len-3))+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+size/2+' '+size/2+')"><title>'+esc(t(it.l)+' : '+CP.money(it.v))+'</title></circle>';
  off+=len;
 });
 s+='<text x="50%" y="48%" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--muted)">'+esc(t('Total'))+'</text><text x="50%" y="60%" text-anchor="middle" font-size="16" style="fill:var(--fg);font-family:var(--disp)">'+esc(CP.compact(tot))+'</text></svg>';
 return s;
};

function totals(g){var d=0,c=0;g.rows.forEach(function(r){d+=nz(r.d);c+=nz(r.c)});return{d:d,c:c,g:Math.round((d-c)*100)/100}}
function alerts(g){
 var L=[],S=CP.S,f=CP.fy(),err=CP.canPost(g.date);
 if(err)L.push({k:'crit',x:err});
 else if(g.date<f.from||g.date>f.to)L.push({k:'warn',x:tf('La date {0} est hors de l’exercice en cours ({1} → {2}).',CP.dfmt(g.date),CP.dfmt(f.from),CP.dfmt(f.to))});
 if(g.ref){var dup=S.entries.filter(function(e){return e.ref&&e.ref.toLowerCase()===g.ref.toLowerCase()&&(e.tiers||'')===(g.tiers||'')})[0];if(dup)L.push({k:'warn',x:tf('Le numéro de pièce « {0} » est déjà utilisé dans {1}.',g.ref,dup.id)})}
 g.rows.forEach(function(r,i){
  var n=i+1;if(!r.acc)return;
  if(!CP.coaGet(r.acc)&&!CP.coaRoot(r.acc))L.push({k:'warn',x:tf('Ligne {0} : le compte {1} n’existe pas dans le plan OHADA.',n,r.acc)});
  if(nz(r.d)&&nz(r.c))L.push({k:'warn',x:tf('Ligne {0} : un montant au débit ET au crédit sur la même ligne.',n)});
  if(r.acc.charAt(0)==='6'&&/ordinateur|laptop|v[ée]hicule|machine|[ée]quipement|mobilier|serveur|imprimante/i.test((r.label||'')+' '+g.label))L.push({k:'warn',x:tf('Ligne {0} : cela ressemble à une immobilisation (classe 2) imputée en charge (classe 6).',n)});
  if(r.acc.indexOf('471')===0)L.push({k:'info',x:tf('Ligne {0} : compte d’attente 471 – pense à le régulariser avant la clôture.',n)});
  if(/^(401|411)/.test(r.acc)&&!g.tiers)L.push({k:'info',x:tf('Ligne {0} : renseigne le tiers pour un compte {1}.',n,r.acc.slice(0,3))})
 });
 var o=g.opt;if(o.pror!==''&&(nz(o.pror)<0||nz(o.pror)>100))L.push({k:'warn',x:t('Le prorata de TVA doit être compris entre 0 et 100 %.')});
 return L;
}
